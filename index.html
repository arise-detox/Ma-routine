<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8a47e">
<title>Ma Routine — Nutrition</title>
<meta name="description" content="Menus et listes de courses du lundi au vendredi, calculés selon tes séances ROAD TO GI, ton poids et ton budget.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ma Routine">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
/* Charte « Cami » (template Squarespace) : fond sable, texte brun très foncé, titres Poppins medium serrés, boutons carrés, beaucoup d'air. Couleurs chaleureuses : sable, crème, terracotta, olive, ocre. */
@font-face{font-family:"Poppins";font-weight:400;font-style:normal;font-display:swap;src:url("./fonts/poppins-400.woff2") format("woff2")}
@font-face{font-family:"Poppins";font-weight:500;font-style:normal;font-display:swap;src:url("./fonts/poppins-500.woff2") format("woff2")}
@font-face{font-family:"Poppins";font-weight:600;font-style:normal;font-display:swap;src:url("./fonts/poppins-600.woff2") format("woff2")}
:root{--bg:#c8a47e;--surface:#f6ebdc;--surface2:#ecd9bf;--field:#fbf3e7;--ink:#1e130e;--line:rgba(30,19,14,.28);--line2:#1e130e;--text:#1e130e;--muted:#4a3326;--gold:#a33b1b;--accent:#b8431f;--red:#9c2a1a;--blue:#7a5a3a;--good:#4f6b2a;--warn:#8f5509;--danger:#a8261c;--navh:66px;--sans:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:400 15px/1.6 var(--sans);letter-spacing:.01em;background:var(--bg);min-height:100vh;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
.app{max-width:820px;margin:0 auto;padding:0 18px calc(var(--navh) + 48px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;margin:0 -18px 14px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:var(--bg);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line2)}
.top::after{content:none}
.brandmark{display:none}
.top .ttl{flex:1;min-width:0}
.top h1{font-weight:500;font-size:27px;line-height:1.15;letter-spacing:-.4px}
.top small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.iconbtn{flex:none;width:42px;height:42px;border-radius:0;border:1px solid var(--line2);background:transparent;font-size:19px;line-height:1;filter:grayscale(1) sepia(.85) saturate(1.4) hue-rotate(-12deg)}
.iconbtn.on{background:var(--surface2)}
.card{background:var(--surface);border:0;border-radius:0;padding:20px 18px;margin:16px 0;box-shadow:none}
.card.hero{background:var(--surface);border-top:3px solid var(--accent);box-shadow:none}
.card.off{opacity:.62}
.card h2{font-weight:500;font-size:21px;line-height:1.25;letter-spacing:-.25px}
.card.hero h2{font-size:26px;letter-spacing:-.4px}
.card h3{font-weight:500;font-size:17px;letter-spacing:-.15px}
.rb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.gap{margin-top:12px}
.eyebrow{color:var(--gold);font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.chip{display:inline-block;border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:500;margin:2px 4px 2px 0;white-space:nowrap}
.chip.red{border-color:var(--danger);color:var(--danger)}
.chip.good{border-color:var(--good);color:var(--good)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.plain{border-color:var(--line);color:var(--muted)}
.btn{background:transparent;border:1px solid var(--line2);border-radius:0;padding:11px 18px;font-weight:500;color:var(--ink);text-decoration:none;display:inline-block;text-align:center;letter-spacing:.02em}
.btn.gold{background:var(--ink);border-color:var(--ink);color:#f3dcc0;box-shadow:none}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.4}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:0;padding:11px 12px;font-size:16px;color:var(--ink)}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::placeholder{color:#8b6f5a;opacity:1}
input[type=date]{min-height:46px}
label.f{display:block;font-size:12.5px;color:var(--muted)}
label.f input,label.f select{margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chk{-webkit-appearance:none;appearance:none;flex:none;width:26px;height:26px;border-radius:0;border:2px solid var(--ink);background:var(--field);position:relative;margin:0}
.chk:checked{background:var(--ink)}
.chk:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#f3dcc0;font-weight:600;font-size:16px}
.bar{height:8px;background:rgba(30,19,14,.14);border-radius:0;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:0}
.bar.over>i{background:var(--danger)}
.bar.blue>i{background:var(--blue)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:8px;justify-items:center}
.ringbox{position:relative;width:104px;height:104px}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ringtxt b{font-size:19px;font-weight:500}
.ringtxt small{font-size:11px;color:var(--muted)}
.ringcap{text-align:center;font-size:12.5px;color:var(--muted);margin-top:2px}
.meal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .t{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.meal .n{background:none;border:0;padding:0;text-align:left;font-weight:500;font-size:16px;line-height:1.35;color:var(--ink);letter-spacing:-.1px}
.meal .m{color:var(--muted);font-size:12.5px;margin-top:3px}
.meal .c{text-align:right;font-weight:500;white-space:nowrap}
.meal .sw{display:block;margin-top:8px;margin-left:auto;background:none;border:1px solid var(--line2);border-radius:0;color:var(--ink);font-size:12px;padding:3px 9px}
.meal.done .n{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(30,19,14,.4)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:5px 5px 0 0;font-size:12.5px;color:var(--ink)}
.seg{display:flex;gap:8px;margin:14px 0}
.seg button{flex:1;padding:11px 4px;border-radius:0;border:1px solid var(--line2);background:transparent;color:var(--ink);font-weight:500;font-size:13px;line-height:1.25}
.seg button.on{background:var(--ink);color:#f3dcc0;border-color:var(--ink)}
.seg button small{display:block;font-weight:400;font-size:10.5px;opacity:.85;margin-top:2px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.days button{padding:10px 2px;border-radius:0;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:500;font-size:13px;line-height:1.2}
.days button.on{background:var(--surface2);color:var(--ink);border-color:var(--ink)}
.days button small{display:block;font-weight:400;font-size:10px;margin-top:2px}
.cyc{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cyc b{display:block;text-align:center;flex:1;font-weight:500}
.cyc button{width:42px;height:42px;border-radius:0;border:1px solid var(--line2);background:transparent;font-size:18px}
.cyc button:disabled{opacity:.3}
.shoprow{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding:13px 0;border-top:1px solid var(--line)}
.shoprow:first-of-type{border-top:0}
.shoprow .chk{grid-row:1/3}
.shoprow .q{grid-column:2;font-weight:600;color:var(--gold)}
.shoprow.stock .q{color:var(--muted)}
.shoprow .pc{display:inline-block;margin-right:7px;padding:1px 9px;border-radius:0;background:var(--ink);color:#f3dcc0;font-size:12.5px;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.shoprow.stock .pc{background:var(--surface2);color:var(--muted)}
.shoprow.ck .pc{opacity:.55}
.shoprow.stock{opacity:.72}
.shoprow.ck b{text-decoration:line-through;color:var(--muted)}
.shoprow b{font-weight:500}
.note{border-left:3px solid var(--accent);padding:12px 14px;background:var(--surface);border-radius:0;color:var(--ink);font-size:13px;margin:16px 0}
.warnbox{border-left:3px solid var(--danger);padding:12px 14px;background:#f3d7cd;border-radius:0;color:#5c1710;font-size:13.5px;margin:16px 0}
.okbox{border-left:3px solid var(--good);padding:12px 14px;background:#e3e2c4;border-radius:0;color:#2f4016;font-size:13.5px;margin:16px 0}
details>summary{cursor:pointer;color:var(--ink);padding:4px 0;list-style:none;font-weight:500}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ ";color:var(--gold);font-weight:600}
details[open]>summary::before{content:"− "}
.rcp{padding:0}
.rcp>summary{padding:16px 18px;display:block}
.rcp .body{padding:0 18px 18px}
.rcp ol{padding-left:20px;margin:12px 0 8px}
.rcp li{margin:6px 0;color:var(--ink)}
.tip{margin-top:12px;padding:11px 13px;background:var(--surface2);border:0;border-radius:0;font-size:13.5px}
.search{margin:6px 0 12px}
.exrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.exrow:first-of-type{border-top:0}
.exrow .d{color:var(--muted);font-size:12.5px}
.exrow button{background:none;border:0;color:var(--danger);font-size:16px;padding:4px 8px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick button{background:transparent;border:1px solid var(--line2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:8px 1px 9px;color:var(--muted);font-weight:500;font-size:10px;letter-spacing:-.1px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:var(--navh);position:relative}
.tabs button .i{font-size:21px;line-height:1.1}
.tabs button .i,.meal .t,.card h3{filter:grayscale(1) sepia(.85) saturate(1.4) hue-rotate(-12deg)}   /* emojis dans les tons bruns */
.tabs button.on{color:var(--gold)}
.tabs button.on::before{content:"";position:absolute;left:18%;right:18%;top:-1px;height:3px;background:var(--accent)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,19,14,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:0;border-top:3px solid var(--accent);border-radius:0;width:min(820px,100%);max-height:88vh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet .x{float:right;margin:-4px -4px 6px 8px}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:0;padding:12px 14px;margin:8px 0}
.opt.cur{border-color:var(--ink);background:var(--surface2)}
.opt b{font-size:14px;font-weight:500}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:#f3dcc0;font-weight:500;border-radius:0;padding:11px 18px;font-size:13.5px;box-shadow:0 6px 20px rgba(30,19,14,.35);max-width:90vw;text-align:center}
.spark{width:100%;height:84px;display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px;margin-top:10px}
.kv span:nth-child(even){text-align:right;font-weight:500}
.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--danger)}
textarea{min-height:80px;resize:vertical}
.big{font-size:32px;font-weight:500;line-height:1.1;letter-spacing:-.6px}
.act{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.act:first-of-type{border-top:0}
.act .d{color:var(--muted);font-size:12.5px}
.act.today{background:var(--surface2);padding-left:8px;padding-right:8px}
/* Pluie de code : désactivée par défaut dans cette charte (option dans les réglages) */
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
@media (max-width:380px){.ringbox{width:92px;height:92px}.ringbox svg{width:92px;height:92px}.grid3{grid-template-columns:1fr 1fr}.tabs button{font-size:8.5px;letter-spacing:-.3px}.top h1{font-size:23px}.app{padding-left:14px;padding-right:14px}.top{margin:0 -14px 12px;padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>

function dateNumber(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');if(!m)return NaN;const t=Date.UTC(+m[1],+m[2]-1,+m[3]);return new Date(t).toISOString().slice(0,10)===v?t:NaN}
function addDays(v,n){return new Date(dateNumber(v)+n*864e5).toISOString().slice(0,10)}
function dow(v){return new Date(dateNumber(v)).getUTCDay()}
function mondayOf(v){return addDays(v,-((dow(v)+6)%7))}
function parisDateKey(now=new Date()){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:PARIS_ZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);

}

const DEFAULT={

// Tout ce qui change les menus ou les quantités (jours, prix, budget, profil…) passe par bump() pour refaire les calculs.
let ver=0;const cycleCache=new Map(),mealCache=new Map(),planCache=new Map();
function bump(){ver++;mealCache.clear();cycleCache.clear();wkCache.clear()}

/* Lien facultatif avec ROAD TO GI : même navigateur = même stockage ; sinon on colle sa sauvegarde. */
function readRtg(){try{const raw=localStorage.getItem('roadToGI_v1');if(!raw)return null;const s=JSON.parse(raw);return s&&typeof s==='object'?s:null}catch(e){return null}}
function applyRtg(s){
  const got=[];
  if(!s||typeof s!=='object')return got;
  if(Number.isFinite(dateNumber(s.startDate))){state.start=mondayOf(s.startDate);got.push('début de la préparation')}
  const bw=Number((s.profile||{}).bodyWeight);
  if(bw>30&&bw<250){
    if(!state.weights.some(w=>w.d===todayKey())){setWeight(todayKey(),bw);got.push('poids '+fmtN(bw)+' kg')}
    if(!(state.profile.weight>0))state.profile.weight=bw;
  }
  resetCaches();
  return got;
}
function ensureStart(){
  if(Number.isFinite(dateNumber(state.start)))return;
  const r=readRtg();
  if(r&&Number.isFinite(dateNumber(r.startDate))){state.start=mondayOf(r.startDate)}
  else{const t=todayKey(),d=dow(t);state.start=(d===6||d===0)?addDays(mondayOf(t),7):mondayOf(t)}
  save();
}

/* ---------- Poids ---------- */
function setWeight(d,kg){
  state.weights=state.weights.filter(w=>w.d!==d);state.weights.push({d,kg});
  state.weights.sort((a,b)=>a.d<b.d?-1:1);
}
const lastWeight=()=>state.weights.length?state.weights[state.weights.length-1]:null;
// pente de la courbe de poids sur les 28 derniers jours (kg par semaine), si au moins 3 pesées sur 7 jours ou plus
function weightTrend(today){
  const from=addDays(today,-28),ws=state.weights.filter(w=>w.d>=from&&w.d<=today);
  if(ws.length<3)return null;
  const x0=dateNumber(ws[0].d)/864e5,xs=ws.map(w=>dateNumber(w.d)/864e5-x0);
  if(xs[xs.length-1]<7)return null;
  const n=ws.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ws.reduce((a,w)=>a+w.kg,0)/n;
  let sxy=0,sxx=0;ws.forEach((w,i)=>{sxy+=(xs[i]-mx)*(w.kg-my);sxx+=(xs[i]-mx)**2});
  return sxx>0?{perWeek:sxy/sxx*7,n,days:xs[xs.length-1]}:null;
}

/* ---------- Dépense énergétique : tes séances ROAD TO GI + poids actuel / poids cible ---------- */
// Planning ROAD TO GI : functional lundi, mercredi, vendredi ; course + abdos mardi, jeudi (et samedi) ; dimanche repos.
const ACT={0:{k:'rest',n:'Repos'},1:{k:'force',n:'Functional training · pecs et dos'},2:{k:'course',n:'Course + abdos'},3:{k:'force',n:'Functional training · jambes et épaules'},4:{k:'course',n:'Course + abdos'},5:{k:'force',n:'Functional training · pecs et dos'},6:{k:'course',n:'Course + circuit'}};
const DAY_NAMES=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const actOf=date=>ACT[dow(date)];
function profileReady(){
  const p=state.profile;
  // le poids cible n'est pas obligatoire pour un objectif « maintien » choisi explicitement
  return p.weight>30&&p.weight<250&&p.height>120&&p.height<230&&p.age>12&&p.age<100&&(p.sex==='H'||p.sex==='F')&&((p.target>30&&p.target<250)||p.goal==='maint');
}
function energy(adjust){
  if(!profileReady())return{ready:false};
  const p=state.profile,w=p.weight;if(adjust===undefined)adjust=p.adjust;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='H'?5:-161),base=bmr*p.pal;
  const tdee={force:base+p.kgForce*w,course:base+p.kgCourse*w,rest:base};
  // objectif choisi (déficit, maintien, prise de muscle) ; « auto » le déduit de l'écart entre ton poids et ton poids cible
  const diff=p.target>0?w-p.target:0,autoMode=diff>0.5?'cut':diff<-0.5?'bulk':'maint',mode=['cut','maint','bulk'].includes(p.goal)?p.goal:autoMode;
  const rate=mode==='maint'?0:p.rate,floor=Math.max(bmr,p.sex==='H'?1500:1200);
  const targets={};let capped=false;
  ['force','course'].forEach(k=>{
    // l'écart hebdomadaire voulu est réparti sur les 5 jours planifiés (le week-end n'est pas compté)
    const want=tdee[k]+(mode==='cut'?-1:mode==='bulk'?1:0)*rate*7700/5+adjust;
    let t=want;
    // jamais plus de 25 % sous la dépense, ni sous le plancher de sécurité (on n'alerte que si cela change vraiment le déficit)
    if(mode==='cut'){const lim=Math.max(tdee[k]*0.75,floor);if(t<lim){t=lim;if(tdee[k]-t<(tdee[k]-want)*0.9)capped=true}}
    targets[k]=Math.round(t/10)*10;
  });
  return{ready:true,bmr,base,tdee,mode,rate,floor,targets,capped,diff,protein:Math.round(p.protKg*w/5)*5};
}
const auto=()=>state.goals.auto&&profileReady();
// objectif du jour : calories du profil, moins la part du cheat meal du week-end à compenser (voir wkApplyComp)
function targetKcal(date){const d=dow(date);if(auto()){const e=energy(),k=ACT[d]&&ACT[d].k==='course'?'course':'force';return Math.round(wkApplyComp(date,e,e.targets[k],e.tdee[k])/10)*10}return state.goals.kcal}
function targetProtein(){return auto()?energy().protein:state.goals.protein}
const rateOptions=mode=>mode==='bulk'?[[0.1,'Doux · +0,1 kg/sem'],[0.2,'Modéré · +0,2 kg/sem'],[0.3,'Rapide · +0,3 kg/sem']]:[[0.25,'Doux · −0,25 kg/sem'],[0.5,'Modéré · −0,5 kg/sem'],[0.75,'Rapide · −0,75 kg/sem']];

/* ---------- Cycles de 4 semaines (lundi-vendredi) alignés sur les 4 semaines d'un programme ROAD TO GI ---------- */
function monthSeed(id){let s=0;for(const c of id)s=(s*31+c.charCodeAt(0))>>>0;return s}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,rand){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// 20 repas par créneau : chaque recette revient au plus ~2 fois et jamais deux fois dans les 4 derniers jours.
function sequence(pool,rand,count){
  const out=[];let bag=[];
  while(out.length<count){
    if(!bag.length)bag=shuffled(pool,rand);
    const recent=out.slice(-4).map(m=>m.id);
    let i=bag.findIndex(m=>!recent.includes(m.id));if(i<0)i=0;
    out.push(bag.splice(i,1)[0]);
  }
  return out;
}
function buildCycle(seed){
  const rand=mulberry32(monthSeed(seed));
  const seqs=SLOTS.map(s=>sequence(s.pool,rand,20));
  return [0,1,2,3].map(w=>[0,1,2,3,4].map(d=>seqs.map(q=>q[w*5+d].id)));
}
const flatIds=weeks=>weeks.flat(2);
function diffRatio(a,b){if(!a||!b||a.length!==b.length)return 1;let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n/a.length}
function differentSalt(cs,prevIds,startSalt){
  let best=startSalt,bestDiff=-1;
  for(let salt=startSalt;salt<startSalt+80;salt++){
    const diff=diffRatio(flatIds(buildCycle(cs+'#'+salt)),prevIds);
    if(diff>bestDiff){bestDiff=diff;best=salt}
    if(diff>=0.70)return{salt,diff};
  }
  return{salt:best,diff:bestDiff};
}
// menus de base d'un cycle (avant jours décochés et ajustement au budget)
function planFor(cs){
  if(planCache.has(cs))return planCache.get(cs);
  const prevIds=cs!==state.start?flatIds(planFor(addDays(cs,-28)).weeks):null;
  let salt=0;
  if(state.rerolls[cs]!=null)salt=state.rerolls[cs];
  else if(prevIds)salt=differentSalt(cs,prevIds,0).salt;
  const weeks=buildCycle(cs+'#'+salt),res={salt,diff:prevIds?diffRatio(flatIds(weeks),prevIds):null,weeks};
  planCache.set(cs,res);return res;
}
function cycleStart(k){return addDays(state.start,28*k)}
function posOf(date){
  const e=Math.round((dateNumber(date)-dateNumber(state.start))/864e5),wk=Math.floor(e/7);
  return{e,wk,upcoming:e<0,k:wk<0?0:Math.floor(wk/4),week:wk<0?0:((wk%4)+4)%4};
}
const dayDate=(cs,w,d)=>addDays(cs,w*7+d);

/* ---------- Jours planifiés, portions, budget ---------- */
// Un jour se décoche en entier (state.off) ; un repas se décoche seul (state.offMeal). Dans les deux cas il quitte les courses et le budget.
const dayOn=(cs,w,d)=>!state.off[`${cs}|${w}|${d}`];
const mealOn=(cs,w,d,s)=>dayOn(cs,w,d)&&!state.offMeal[`${cs}|${w}|${d}|${s}`];
const dayMask=(cs,w,d)=>[0,1,2].map(s=>mealOn(cs,w,d,s));
const dayActive=(cs,w,d)=>dayMask(cs,w,d).some(Boolean);
function daysOn(cs,w){let n=0;for(let d=0;d<5;d++)if(dayActive(cs,w,d))n++;return n}
function cycleDays(cs){let n=0;for(let w=0;w<4;w++)n+=daysOn(cs,w);return n}
function weekMeals(cs,w){let n=0;for(let d=0;d<5;d++)n+=dayMask(cs,w,d).filter(Boolean).length;return n}
function cycleMeals(cs){let n=0;for(let w=0;w<4;w++)n+=weekMeals(cs,w);return n}
const SHARE=[0.30,0.36,0.34];   // part des calories du jour : matin, midi, soir
const budgetPerDay=()=>state.goals.budget/20;
const budgetPerMeal=()=>state.goals.budget/60;
// budget dégressif : 230 € pour 60 repas = 3,83 € par repas (11,50 € par jour de 3 repas) ; chaque jour ou repas décoché retire sa part
const cycleBudget=cs=>Math.round(budgetPerMeal()*cycleMeals(cs)*100)/100;
// marge de sécurité (imprévus, écarts de prix) : 15 € pour un cycle de 60 repas, au prorata des repas gardés
const cycleMargin=cs=>Math.round(state.goals.margin*cycleMeals(cs)/60*100)/100;
const price=k=>{const v=state.prices[k];return Number.isFinite(v)&&v>0?v:wkFood(k).packPrice};

function scaleIngredient(txt,k,f){
  // « 100 g riz cru » -> « 85 g riz cru » ; « 3 tranches pain complet » -> « 2,5 tranches pain complet »
  const m=/^(\d+(?:[.,]\d+)?)\s*(g|ml|tranches?)?\s+(.*)$/.exec(txt);
  if(!m)return txt;
  const kw={oats:'avoine',rice:'riz',pasta:'pâtes',potatoes:'pommes de terre',semolina:'semoule',bread:'pain'}[k];
  if(!kw||!m[3].toLowerCase().includes(kw))return txt;
  let q=parseFloat(m[1].replace(',','.'))*f;
  if(m[2]==='g'||m[2]==='ml')return `${Math.max(5,Math.round(q/5)*5)} ${m[2]} ${m[3]}`;
  q=Math.max(0.5,Math.round(q*2)/2);
  return `${fmtN(q,1)} ${q>1?'tranches':'tranche'} ${m[3]}`;
}
// f = facteur appliqué aux féculents de la recette (1 = recette d'origine)
function scaleMeal(m,f){
  const ck=m.id+'|'+f;
  if(mealCache.has(ck))return mealCache.get(ck);
  const shop={};let cost=0.2;
  Object.entries(m.shop).forEach(([k,q])=>{const qq=STARCH.has(k)?q*f:q;shop[k]=qq;cost+=qq/FOODS[k].packSize*price(k)});
  let ingredients=m.ingredients;
  if(f!==1)ingredients=m.ingredients.map(t=>{for(const k of Object.keys(m.shop))if(STARCH.has(k)){const r=scaleIngredient(t,k,f);if(r!==t)return r}return t});
  const res={...m,f,kcal:Math.round((m.kcal+(f-1)*m.sk)/5)*5,protein:Math.round(m.protein+(f-1)*m.sp),cost:Math.round(cost*100)/100,shop,ingredients};
  mealCache.set(ck,res);return res;
}
// facteur de féculents du jour pour atteindre les calories visées sur les repas gardés (0,5 à 1,8, par pas de 0,05)
function scaledDay(date,ids,mask){
  const base=ids.map(i=>MEAL_BY_ID[i]),on=mask||[true,true,true];
  const share=on.reduce((a,v,s)=>a+(v?SHARE[s]:0),0);
  let S=0,B=0;base.forEach((m,s)=>{if(on[s]){S+=m.sk;B+=m.kcal}});
  let f=1;
  if(S>0)f=Math.round(Math.min(1.8,Math.max(0.5,1+(targetKcal(date)*share-B)/S))*20)/20;
  return{f,share,meals:base.map(m=>scaleMeal(m,f))};
}

// menus effectifs d'un cycle : menus de base, ajustés au budget quand les jours choisis le demandent
function planCost(cs,ids){
  const inv={};let total=0;
  for(let w=0;w<4;w++){
    const needs={};
    for(let d=0;d<5;d++){
      const mask=dayMask(cs,w,d);
      if(!mask.some(Boolean))continue;
      scaledDay(dayDate(cs,w,d),ids[w][d],mask).meals.forEach((m,s)=>{if(mask[s])Object.entries(m.shop).forEach(([k,q])=>{needs[k]=(needs[k]||0)+q})});
    }
    Object.entries(needs).forEach(([k,need])=>{
      const f=FOODS[k],avail=inv[k]||0,deficit=Math.max(0,need-avail);
      let bought=0;
      if(deficit>0){const u=Math.ceil(deficit/f.packSize-1e-9);bought=u*f.packSize;total+=u*price(k)}
      inv[k]=Math.max(0,avail+bought-need);
    });
  }
  return total;
}
function optimizeIds(cs,base){
  const budget=cycleBudget(cs)-cycleMargin(cs),ids=base.map(w=>w.map(d=>d.slice()));
  const info={changed:0,before:planCost(cs,ids),after:0};
  let cost=info.before;
  if(cost<=budget){info.after=cost;return{ids,info}}
  for(let it=0;it<30&&cost>budget*0.98;it++){
    let best=null;
    for(let w=0;w<4;w++)for(let d=0;d<5;d++){
      for(let s=0;s<3;s++){
        if(!mealOn(cs,w,d,s)||state.swaps[`${cs}|${w}|${d}|${s}`])continue;
        const cur=ids[w][d][s];
        for(const m of SLOTS[s].pool){
          if(m.id===cur)continue;
          let dup=false;for(let d2=0;d2<5;d2++)if(d2!==d&&mealOn(cs,w,d2,s)&&ids[w][d2][s]===m.id)dup=true;
          if(dup)continue;
          ids[w][d][s]=m.id;const c=planCost(cs,ids);ids[w][d][s]=cur;
          if(!best||c<best.c)best={w,d,s,id:m.id,c};
        }
      }
    }
    if(!best||best.c>=cost-0.01)break;
    ids[best.w][best.d][best.s]=best.id;cost=best.c;info.changed++;
  }
  info.after=cost;return{ids,info};
}
function cycleIds(cs){
  const c=cycleCache.get(cs);if(c&&c.ver===ver)return c;
  const o=optimizeIds(cs,planFor(cs).weeks),res={ver,ids:o.ids,info:o.info};
  cycleCache.set(cs,res);return res;
}
function idAt(cs,w,d,s){
  const sw=state.swaps[`${cs}|${w}|${d}|${s}`];
  return MEAL_BY_ID[sw]?sw:cycleIds(cs).ids[w][d][s];
}
const mealSwapped=(cs,w,d,s)=>{const sw=state.swaps[`${cs}|${w}|${d}|${s}`];return !!(MEAL_BY_ID[sw]&&sw!==planFor(cs).weeks[w][d][s])};
// meals : les 3 repas du jour ; on[s] : le repas est gardé ; tot et target ne comptent que les repas gardés
function dayPlan(cs,w,d){
  const date=dayDate(cs,w,d),mask=dayMask(cs,w,d),sd=scaledDay(date,[0,1,2].map(s=>idAt(cs,w,d,s)),mask);
  const tot=sd.meals.reduce((a,m,s)=>mask[s]?{kcal:a.kcal+m.kcal,prot:a.prot+m.protein,cost:a.cost+m.cost}:a,{kcal:0,prot:0,cost:0});
  return{date,f:sd.f,meals:sd.meals,tot,on:mask,any:mask.some(Boolean),target:Math.round(targetKcal(date)*sd.share),fullTarget:targetKcal(date),dayOff:!dayOn(cs,w,d)};
}

function weekNeeds(cs,w){
  const t={};
  for(let d=0;d<5;d++){
    const P=dayPlan(cs,w,d);
    P.meals.forEach((m,s)=>{if(P.on[s])Object.entries(m.shop).forEach(([k,v])=>{t[k]=(t[k]||0)+v})});
  }
  return t;
}
function purchasePlan(cs){
  const inv={},weeks=[];let total=0;
  for(let w=0;w<4;w++){
    const needs=weekNeeds(cs,w),buys={};let cost=0;
    Object.entries(needs).forEach(([k,need])=>{
      const f=FOODS[k],avail=inv[k]||0,deficit=Math.max(0,need-avail);
      let units=0,bought=0,c=0;
      if(deficit>0){units=Math.ceil(deficit/f.packSize-1e-9);bought=units*f.packSize;c=units*price(k)}
      const left=Math.max(0,avail+bought-need);inv[k]=left;
      buys[k]={need,avail,units,left,cost:c};cost+=c;
    });
    total+=cost;weeks.push({needs,buys,cost});
  }
  return{weeks,total};
}
function fmtQty(k,v){
  const f=wkFood(k);
  if(f.unit==='g')return v>=1000?(v/1000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' kg':Math.round(v)+' g';
  if(f.unit==='ml')return v>=1000?(v/1000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' L':Math.round(v)+' ml';
  const n=Math.ceil(v-1e-9);
  if(f.unit==='u')return n+' unité'+(n>1?'s':'');
  if(f.unit==='tranche')return n+' tranche'+(n>1?'s':'');
  if(f.unit==='boîte')return n+' boîte'+(n>1?'s':'');
  return String(v);
}
const buyText=(k,p)=>FOODS[k].loose?`${p.units} ${p.units>1?FOODS[k].pack.toLowerCase():FOODS[k].pack.toLowerCase().replace(/s$/,'')}`:`${p.units} × ${FOODS[k].packLabel}`;
function cycleSpend(cs){const end=addDays(cs,27);return state.spend.filter(x=>x.d>=cs&&x.d<=end).reduce((a,x)=>a+x.a,0)}
// reste sur le budget initial à la fin du cycle : budget - le plus grand des achats prévus (liste ajustée) + marge, et de ce qui est déjà dépensé
function budgetLeft(cs){
  const planned=purchasePlan(cs).total,spent=cycleSpend(cs),init=state.goals.budget,margin=cycleMargin(cs);
  return{init,planned,spent,margin,left:init-Math.max(planned+margin,spent)};
}
// retire / remet un jour ou un repas, puis annonce l'effet sur les courses et sur le reste du budget
function changePlan(cs,fn){
  const b=budgetLeft(cs);fn();bump();save();
  const a=budgetLeft(cs),d=a.planned-b.planned;
  keepScroll(render);
  toast(`${Math.abs(d)<0.005?'Liste de courses mise à jour':'Courses '+(d<0?'−':'+')+euro(Math.abs(d))} · il te reste ${euro(a.left)} sur ton budget`);
}

    nOn++;wk.kcal+=P.tot.kcal;wk.prot+=P.tot.prot;wk.cost+=P.tot.cost;

/* ---------- Week-end : planification (samedi + dimanche, 3 repas par jour) ---------- */
// Thème du mois (change chaque mois), recettes différentes chaque week-end, courses au conditionnement (les restes qui se gardent servent aux week-ends suivants du mois).
// Chaque repas se retire (case décochée) : il sort des courses, du budget et du bilan calorique, et l'argent économisé s'affiche.
const wkBudget=()=>{const v=state.goals.wkBudget;return v>0?v:40};
function wkNeeds(recs){const t={};recs.forEach(r=>Object.entries(r.shop).forEach(([k,q])=>{t[k]=(t[k]||0)+q}));return t}
function wkBuy(recs,inv){
  const needs=wkNeeds(recs),buys={},next={};let total=0;
  Object.keys(inv).forEach(k=>{if(!(k in needs)&&!WK_FRESH.has(k))next[k]=inv[k]});
  Object.entries(needs).forEach(([k,need])=>{
    const f=wkFood(k),avail=inv[k]||0,deficit=Math.max(0,need-avail),units=deficit>0?Math.ceil(deficit/f.packSize-1e-9):0;
    const left=avail+units*f.packSize-need,cost=units*price(k);
    buys[k]={need,avail,units,left,cost};total+=cost;
    if(!WK_FRESH.has(k)&&left>1e-9)next[k]=left;
  });
  return{needs,buys,total:Math.round(total*100)/100,inv:next};
}
// Petits-déjeuners : une rotation commune à tous les mois (chaque recette revient tous les 7 week-ends, jamais deux week-ends de suite).
const WK_BRK=WK_RECIPES.filter(r=>r.slot===0);
function wkBrkOrder(block){
  const prevTail=block>0?wkBrkOrder(block-1).slice(-2).map(r=>r.id):[];
  for(let a=0;a<200;a++){
    const o=shuffled(WK_BRK,mulberry32(monthSeed('brk|'+block+'|'+a)));
    if(!prevTail.includes(o[0].id)&&!prevTail.includes(o[1].id))return o;
  }
  return shuffled(WK_BRK,mulberry32(monthSeed('brk|'+block)));
}
const wkBrkPair=sat=>{const n=Math.round(dateNumber(sat)/864e5/7),o=wkBrkOrder(Math.floor(n/7)),pos=((n%7)+7)%7;return[o[pos*2],o[pos*2+1]]};
function wkPick(sat,salt,inv,prev,theme){
  const budget=wkBudget(),mains=WK_RECIPES.filter(r=>r.slot===1&&r.theme===theme),base=wkBrkPair(sat);
  // recettes de petit-déjeuner à éviter pour un autre tirage : celles de ce week-end et des deux voisins
  const near=new Set(base.map(r=>r.id));
  [-7,7].forEach(dd=>wkBrkPair(addDays(sat,dd)).forEach(r=>near.add(r.id)));
  const others=WK_BRK.filter(r=>!near.has(r.id));
  let best=null;
  for(let a=0;a<2500;a++){
    const rand=mulberry32(monthSeed(sat+'|'+salt+'|'+a));
    // rotation habituelle d'abord ; si les courses dépassent le budget (ou nouveau tirage demandé), on essaie d'autres petits-déjeuners
    const b=(!salt&&a<150&&!base.some(r=>prev.has(r.id)))?base:shuffled(others.filter(r=>!prev.has(r.id)),rand).slice(0,2);
    const m=shuffled(mains.filter(r=>!prev.has(r.id)),rand).slice(0,4);
    const recs=[b[0],m[0],m[1],b[1],m[2],m[3]],buy=wkBuy(recs,inv);
    if(!best||buy.total<best.buy.total)best={recs,buy};
    if(buy.total<=budget+0.005){best={recs,buy};break}
  }
  return best;
}
// Repas retirés : état `wkoff` clé « samedi|numéro du repas (0 à 5) ».
const wkOn=(sat,i)=>!state.wkoff[`${sat}|${i}`];
// sat = date du samedi (AAAA-MM-JJ). Le thème dépend du mois du samedi ; les menus sont choisis avec les 6 repas (ils ne changent pas quand on retire un repas),
// puis les courses réelles sont recalculées avec les repas gardés et les restes réellement achetés.
function wkPlan(sat){
  if(wkCache.has(sat))return wkCache.get(sat);
  const i=Math.floor((+sat.slice(8,10)-1)/7),theme=((+sat.slice(0,4))*12+(+sat.slice(5,7)-1))%WK_THEMES.length;
  let inv={},invA={},prev=new Set(),res=null;
  for(let j=0;j<=i;j++){
    const s=addDays(sat,-7*(i-j)),r=wkPick(s,state.wksalt[s]||0,inv,prev,theme);
    inv=r.buy.inv;prev=new Set(r.recs.map(x=>x.id));
    const on=r.recs.map((_,n)=>wkOn(s,n)),act=wkBuy(r.recs.filter((_,n)=>on[n]),invA),full=wkBuy(r.recs,invA);
    invA=act.inv;
    res={sat:s,i:j,theme,recs:r.recs,on,buy:act,full,saved:Math.round((full.total-act.total)*100)/100};
    wkCache.set(s,res);
  }
  return res;
}
const wkRecipeCost=r=>Math.round((0.15+Object.entries(r.shop).reduce((a,[k,q])=>a+q/wkFood(k).packSize*price(k),0))*100)/100;
function wkDefaultSat(){const t=todayKey(),d=dow(t);return d===6?t:d===0?addDays(t,-1):addDays(t,6-d)}
const WK_SLOT_ICO=['☀️','🍽️','🌙'];
// repas d'un jour : 0 = samedi, 1 = dimanche (indices 0 à 2 et 3 à 5)
const wkDay=(P,day)=>P.recs.slice(day*3,day*3+3);
const wkDayTot=(P,day)=>wkDay(P,day).reduce((a,r,s)=>P.on[day*3+s]?{kcal:a.kcal+r.kcal,prot:a.prot+r.protein}:a,{kcal:0,prot:0});

/* ---------- Bilan calorique du week-end et compensation en semaine ---------- */
// kcal au-dessus (+) ou en dessous (−) de la dépense estimée, pour les repas gardés (part de la journée comme en semaine : 30 / 36 / 34 %)
function wkSurplus(sat){
  const E=energy();if(!E.ready)return 0;
  const P=wkPlan(sat);let s=0;
  [0,1].forEach(day=>{let k=0,sh=0;[0,1,2].forEach(sl=>{const n=day*3+sl;if(P.on[n]){k+=P.recs[n].kcal;sh+=SHARE[sl]}});s+=k-E.tdee[ACT[dow(addDays(sat,day))].k]*sh});
  return s;
}
// le surplus du week-end est retiré en semaine : réparti sur les 5 jours du lundi au vendredi qui précèdent, sans passer sous la limite de sécurité
function wkApplyComp(date,E,base,tdee){
  const dd=dow(date);
  if(!state.goals.wkComp||dd<1||dd>5)return base;
  const S=wkSurplus(addDays(mondayOf(date),5));
  if(!(S>0))return base;
  const lim=Math.max(tdee*0.75,E.floor);
  return Math.min(base,Math.max(base-S/5,lim));
}
// calories retirées ce jour-là pour compenser le week-end
const wkCompKcal=date=>{const E=energy();if(!E.ready)return 0;const k=ACT[dow(date)].k==='course'?'course':'force';return Math.round((E.targets[k]-wkApplyComp(date,E,E.targets[k],E.tdee[k]))/10)*10};
// argent économisé sur les week-ends passés ou en cours (budget non dépensé et repas retirés)
function wkSavings(){
  const t=todayKey(),first=addDays(state.start,5),last=addDays(t,-((dow(t)+1)%7));
  let n=0,left=0,removed=0;
  for(let s=first,i=0;s<=last&&i<104;s=addDays(s,7),i++){const P=wkPlan(s);n++;left+=wkBudget()-P.buy.total;removed+=P.saved}
  return{n,left:Math.round(left*100)/100,removed:Math.round(removed*100)/100};
}

/* --- Objectif : profil, calories, efficacité --- */
function sparkline(){
  const ws=state.weights.slice(-30);
  if(ws.length<2)return '';
  const min=Math.min(...ws.map(w=>w.kg)),max=Math.max(...ws.map(w=>w.kg)),span=Math.max(0.5,max-min);
  const px=i=>(8+i*(304/(ws.length-1))).toFixed(1),py=w=>(70-((w.kg-min)/span)*56).toFixed(1);
  return `<svg class="spark" viewBox="0 0 320 84" preserveAspectRatio="none" role="img" aria-label="Courbe de poids"><polyline points="${ws.map((w,i)=>px(i)+','+py(w)).join(' ')}" fill="none" stroke="#b8431f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${ws.map((w,i)=>`<circle cx="${px(i)}" cy="${py(w)}" r="3" fill="#1e130e"/>`).join('')}</svg><div class="rb small muted"><span>${fmtN(min)} kg</span><span>${fmtN(max)} kg</span></div>`;
}
// variation de poids prévue par semaine (kg) avec les jours planifiés du cycle
function plannedWeekly(cs,E){
  let kcal=0;
  for(let w=0;w<4;w++)for(let d=0;d<5;d++){
    // l'écart s'applique à la part de la journée qui reste au menu
    const share=dayMask(cs,w,d).reduce((a,v,s)=>a+(v?SHARE[s]:0),0);
    if(!share)continue;
    const date=dayDate(cs,w,d),k=ACT[dow(date)].k;
    kcal+=(wkApplyComp(date,E,E.targets[k],E.tdee[k])-E.tdee[k])*share;
  }
  // + bilan des 4 week-ends cheat meal du cycle (repas gardés) : ce qui n'est pas compensé en semaine réduit le déficit
  for(let w=0;w<4;w++)kcal+=wkSurplus(addDays(dayDate(cs,w,0),5));
  return kcal/4/7700;
}

/* ---------- Fenêtres (recette, remplacement d'un repas) ---------- */
const modal=document.getElementById('modal');
function openModal(html){modal.innerHTML=`<div class="sheet"><button class="btn sm x" data-act="close" type="button" aria-label="Fermer">✕</button>${html}</div>`;modal.hidden=false;document.body.style.overflow='hidden'}
function closeModal(){modal.hidden=true;modal.innerHTML='';document.body.style.overflow=''}
modal.addEventListener('click',e=>{
  if(e.target===modal||e.target.closest('[data-act="close"]')){closeModal();return}
  const t=e.target.closest('[data-act="pick"]');
  if(t){
    const k=`${t.dataset.cs}|${t.dataset.w}|${t.dataset.d}|${t.dataset.s}`;
    if(t.dataset.id==='')delete state.swaps[k];else state.swaps[k]=t.dataset.id;
    bump();save();closeModal();keepScroll(render);toast(t.dataset.id===''?'Repas d’origine remis':'Repas remplacé');
  }
});
function openRecipe(id,f){const m=MEAL_BY_ID[id];if(m)openModal(`<h2>${esc(m.name)}</h2><div class="gap">${recipeBody(scaleMeal(m,f||1))}</div>`)}
function openSwap(cs,w,d,s){
  const P=dayPlan(cs,w,d),cur=P.meals[s],orig=MEAL_BY_ID[planFor(cs).weeks[w][d][s]];
  const opts=SLOTS[s].pool.map(m0=>{
    const m=scaleMeal(m0,P.f),dk=m.kcal-cur.kcal,dp=m.protein-cur.protein;
    return `<button class="opt ${m0.id===cur.id?'cur':''}" data-act="pick" data-cs="${cs}" data-w="${w}" data-d="${d}" data-s="${s}" data-id="${m0.id===orig.id?'':m0.id}"><div><b>${esc(m0.name)}</b><small>${m.kcal} kcal (${dk>=0?'+':''}${dk}) · ${m.protein} g (${dp>=0?'+':''}${dp}) · ${euro(m.cost)}${m0.id===orig.id?' · menu prévu':''}</small></div><span>${m0.id===cur.id?'✓':''}</span></button>`;
  }).join('');
  openModal(`<h2>Changer le repas</h2><p class="muted small gap">${SLOTS[s].ico} ${SLOTS[s].name} · ${dLong(dayDate(cs,w,d))}. La liste de courses se met à jour.</p><div class="gap">${opts}</div>`);
}

const TITLES={today:'Nutrition · du lundi au vendredi',menus:'Menus du cycle',shop:'Courses et budget',cheat:'Cheat meal du week-end',goal:'Poids, calories, objectif',recipes:'Recettes',settings:'Réglages'};
function render(){
  const fn={today:renderToday,menus:renderMenus,shop:renderShop,cheat:renderCheat,goal:renderGoal,recipes:renderRecipes,settings:renderSettings}[ui.tab]||renderToday;
  view.innerHTML=fn();
  document.getElementById('sub').textContent=TITLES[ui.tab]||'';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  document.getElementById('gear').classList.toggle('on',ui.tab==='settings');
}
function goto(tab){ui.tab=tab;render();window.scrollTo(0,0);decodeTitles()}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)goto(b.dataset.tab)});
document.getElementById('gear').addEventListener('click',()=>goto(ui.tab==='settings'?'today':'settings'));

view.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,D=t.dataset;
  switch(a){
    case 'goto':goto(D.tab);break;
    case 'recipe':openRecipe(D.id,Number(D.f)||1);break;
    case 'wkrecipe':openCheat(D.id);break;
    case 'wkweek':ui.wk=addDays(ui.wk||wkDefaultSat(),7*Number(D.v));keepScroll(render);break;
    case 'wkreroll':{const s=ui.wk||wkDefaultSat();state.wksalt[s]=(state.wksalt[s]||0)+1;Object.keys(state.wkoff).filter(k=>k.startsWith(s+'|')).forEach(k=>delete state.wkoff[k]);bump();save();render();toast('Nouveau menu pour ce week-end');break}
    case 'wkmealtoggle':wkToggleMeal(D.k,!!state.wkoff[D.k]);break;
    case 'swap':openSwap(D.cs,+D.w,+D.d,+D.s);break;
    case 'cyc':{const c=uiCycle();ui.k=Math.max(0,c.k+Number(D.v));ui.week=0;render();break}
    case 'week':ui.week=+D.w;keepScroll(render);break;
    case 'dayon':{
      // jour gardé -> retiré ; jour retiré (ou sans aucun repas) -> remis en entier avec ses 3 repas
      const [dcs,dw,dd]=D.k.split('|');
      changePlan(dcs,()=>{
        if(dayActive(dcs,+dw,+dd))state.off[D.k]=true;
        else{delete state.off[D.k];[0,1,2].forEach(s=>delete state.offMeal[`${D.k}|${s}`])}
      });break;
    }
    case 'mealtoggle':changePlan(D.k.split('|')[0],()=>{if(state.offMeal[D.k])delete state.offMeal[D.k];else state.offMeal[D.k]=true});break;
    case 'water':{const d=todayKey();state.water[d]=Math.max(0,Math.min(10000,(state.water[d]||0)+Number(D.v)));save();keepScroll(render);break}
    case 'quick':{const q=QUICK[+D.i],d=todayKey();(state.extras[d]??=[]).push({n:q.n,k:q.k,p:q.p,c:q.c});save();keepScroll(render);toast('Ajouté : '+q.n);break}
    case 'extra-add':{
      const n=(document.getElementById('xn').value||'').trim()||'Ajout',k=num(document.getElementById('xk').value),p=num(document.getElementById('xp').value);
      if(!(k>=0)){toast('Indique les calories');break}
      const d=todayKey();(state.extras[d]??=[]).push({n,k:Math.round(k),p:Number.isFinite(p)?Math.round(p):0,c:0});save();keepScroll(render);break;
    }
    case 'extra-del':{const d=todayKey();(state.extras[d]||[]).splice(+D.i,1);save();keepScroll(render);break}
    case 'weight-add':{
      const v=num(document.getElementById('wkg').value);
      if(!(v>30&&v<250)){toast('Entre un poids en kg (ex. 89,5)');break}
      setWeight(todayKey(),v);if(!(state.profile.weight>0)){state.profile.weight=v;bump()}
      save();keepScroll(render);toast('Poids enregistré');break;
    }
    case 'weight-del':state.weights=state.weights.filter(w=>w.d!==D.d);save();keepScroll(render);break;
    case 'weight-sync':{const lw=lastWeight();if(lw){state.profile.weight=lw.kg;bump();save();keepScroll(render);toast('Calories recalculées')}break}
    case 'adjust':state.profile.adjust=Number(D.v)||0;bump();save();keepScroll(render);toast('Ajustement enregistré');break;
    case 'spend-add':{
      const v=num(document.getElementById('sa').value),l=(document.getElementById('sl').value||'').trim();
      if(!(v>0)){toast('Indique un montant');break}
      state.spend.push({id:Date.now().toString(36),d:todayKey(),l,a:Math.round(v*100)/100});save();keepScroll(render);toast('Dépense ajoutée');break;
    }
    case 'spend-del':state.spend=state.spend.filter(x=>x.id!==D.id);save();keepScroll(render);break;
    case 'prices-reset':if(confirm('Remettre tous les prix d’origine ?')){state.prices={};bump();save();keepScroll(render)}break;
    case 'rcat':ui.rcat=D.v;keepScroll(render);break;
    case 'rtg-import':{const got=applyRtg(readRtg());save();document.getElementById('rtgStatus').textContent=got.length?'Repris : '+got.join(', ')+'.':'Rien à reprendre.';break}
    case 'rtg-paste':{
      const st=document.getElementById('rtgStatus');let data;
      try{data=JSON.parse(document.getElementById('rtgText').value)}catch(err){st.textContent='Texte illisible : colle la sauvegarde complète.';break}
      const s=data&&data.app==='road-to-gi'&&data.state;
      if(!s||typeof s!=='object'){st.textContent='Ce texte n’est pas une sauvegarde ROAD TO GI.';break}
      const got=applyRtg(s);save();st.textContent=got.length?'Repris : '+got.join(', ')+'.':'Rien à reprendre dans cette sauvegarde.';break;
    }
    case 'reroll':{
      if(!confirm('Remplacer les menus du cycle affiché par de nouveaux menus ?'))break;
      const c=uiCycle(),cur=planFor(c.cs),ch=differentSalt(c.cs,flatIds(cur.weeks),cur.salt+1);
      state.rerolls[c.cs]=ch.salt;
      Object.keys(state.swaps).filter(k=>k.startsWith(c.cs+'|')).forEach(k=>delete state.swaps[k]);
      resetCaches();save();render();toast('Nouveaux menus pour ce cycle');break;
    }
    case 'backup-copy':{
      const box=document.getElementById('backupText'),st=document.getElementById('backupStatus'),text=JSON.stringify({app:'ma-routine',version:2,state});
      box.value=text;
      (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>{st.textContent='Sauvegarde copiée. Colle-la dans une note ou un message à toi-même.'},()=>{box.focus();box.select();st.textContent='Copie le texte sélectionné ci-dessus.'});
      break;
    }
    case 'backup-restore':{
      const st=document.getElementById('backupStatus');let data;
      try{data=JSON.parse(document.getElementById('backupText').value)}catch(err){st.textContent='Texte illisible : colle la sauvegarde complète.';break}
      const s=data&&data.app==='ma-routine'&&data.state;
      if(!s||typeof s!=='object'){st.textContent='Ce texte n’est pas une sauvegarde Ma Routine.';break}
      if(!confirm('Remplacer les données de ce téléphone par cette sauvegarde ?'))break;
      store.set(KEY,JSON.stringify(s));state=load();resetCaches();ensureStart();save();render();rain.start();toast('Sauvegarde restaurée');break;
    }
    case 'reset':if(confirm('Tout effacer sur ce téléphone (objectifs, profil, repas cochés, poids) ?')){store.del(KEY);state=load();resetCaches();ensureStart();ui.k=null;ui.week=null;render();rain.start();toast('Données effacées')}break;
  }
});
view.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;
  const a=t.dataset.chg,k=t.dataset.k;
  switch(a){
    case 'meal':if(t.checked)state.checks[k]=true;else delete state.checks[k];save();keepScroll(render);break;
    case 'mealon':changePlan(k.split('|')[0],()=>{if(t.checked)delete state.offMeal[k];else state.offMeal[k]=true});break;
    case 'shop':if(t.checked)state.shop[k]=true;else delete state.shop[k];save();keepScroll(render);break;
    case 'wkmeal':wkToggleMeal(k,t.checked);break;
    case 'wkcomp':state.goals.wkComp=t.checked;bump();save();keepScroll(render);toast(t.checked?'Compensation en semaine activée':'Compensation en semaine désactivée');break;
    case 'wkshop':if(t.checked)state.wshop[k]=true;else delete state.wshop[k];save();keepScroll(render);break;
    case 'goal':{
      const v=num(t.value),min={budget:50,margin:0,wkBudget:10,kcal:1200,protein:60,water:500}[k];
      if(v>=min)state.goals[k]=(k==='budget'||k==='margin'||k==='wkBudget')?Math.round(v*100)/100:Math.round(v);
      bump();save();keepScroll(render);break;
    }
    case 'goalauto':state.goals.auto=t.checked;bump();save();keepScroll(render);break;
    case 'fxrain':state.fx.rain=t.checked;save();rain.start();break;
    case 'fxlevel':if(['low','mid','high'].includes(t.value)){state.fx.level=t.value;save();rain.start()}break;
    case 'fxcolor':if(['white','color'].includes(t.value)){state.fx.color=t.value;save();rain.start()}break;
    case 'prof':{
      const p=state.profile;
      if(k==='sex')p.sex=t.value;
      else if(k==='goal')p.goal=['cut','maint','bulk'].includes(t.value)?t.value:'auto';
      else if(k==='pal'||k==='rate'){const v=num(t.value);if(v>0)p[k]=v}
      else{
        const v=num(t.value),lim={age:[13,99],height:[120,230],weight:[30,250],target:[30,250],kgForce:[1,15],kgCourse:[1,15]}[k];
        if(v>=lim[0]&&v<=lim[1])p[k]=(k==='age'||k==='height')?Math.round(v):Math.round(v*10)/10;
        if(k==='weight'&&v>=30&&v<=250)setWeight(todayKey(),Math.round(v*10)/10);
      }
      // si le sens de l'objectif change, on prend le rythme du milieu
      const E=energy();if(E.ready&&E.mode!=='maint'&&!rateOptions(E.mode).some(([v])=>Math.abs(v-p.rate)<0.001))p.rate=rateOptions(E.mode)[1][0];
      bump();save();keepScroll(render);break;
    }
    case 'start':{
      if(Number.isFinite(dateNumber(t.value))){state.start=mondayOf(t.value);resetCaches();ui.k=null;ui.week=null;save();render();toast('Départ : lundi '+dShort(state.start))}
      break;
    }
    case 'price':{const v=num(t.value);if(v>0)state.prices[k]=Math.round(v*100)/100;else delete state.prices[k];bump();save();keepScroll(render);break}
    case 'rweek':ui.rweek=t.checked;keepScroll(render);break;
  }
});
view.addEventListener('input',e=>{

document.addEventListener('visibilitychange',()=>{

/* ---------- Ambiance Matrix : pluie de code colorée + titres qui se décodent ---------- */
const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const GLYPHS=(()=>{let s='';for(let c=0xFF66;c<=0xFF9D;c++)s+=String.fromCharCode(c);return s+'0123456789=+*<>:'})();
const rain=(()=>{
  const cv=document.getElementById('rain'),ctx=cv.getContext('2d');
  // blanc et gris par défaut (code blanc sur noir) ; option « colorée » : or, bleu clair, rouge, blanc
  const PALETTES={white:['#1e130e','#4a3326','#7a5a3a','#a33b1b'],color:['#b8431f','#d98a3d','#8f5509','#1e130e']};
  const LEVELS={low:{op:.4,gap:22,fps:14},mid:{op:.68,gap:18,fps:18},high:{op:.92,gap:14,fps:22}};
  const colors=()=>PALETTES[state.fx.color]||PALETTES.white;
  let w=0,h=0,size=15,gap=18,fps=18,cols=[],last=0,raf=0,running=false;
  function reset(c,first){c.y=first?(Math.random()*1.3-0.3)*(h/size):-Math.random()*8;{const P=colors();c.col=P[(Math.random()*P.length)|0]}c.sp=0.55+Math.random()*0.9;c.pg=null}
  function layout(){
    const L=LEVELS[state.fx.level]||LEVELS.mid;gap=L.gap;fps=L.fps;size=Math.round(gap*0.85);cv.style.opacity=L.op;
    w=cv.width=window.innerWidth;h=cv.height=window.innerHeight;
    cols=[];for(let i=0;i<Math.ceil(w/gap);i++){const c={};reset(c,true);cols.push(c)}
    ctx.clearRect(0,0,w,h);
  }
  function frame(t){
    if(!running)return;
    raf=requestAnimationFrame(frame);
    if(t-last<1000/fps)return;last=t;
    ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,0.075)';ctx.fillRect(0,0,w,h);   // les traînées s'effacent peu à peu
    ctx.globalCompositeOperation='source-over';ctx.textBaseline='top';
    ctx.font=size+'px "Hiragino Sans","Hiragino Kaku Gothic ProN","Courier New",monospace';
    for(let i=0;i<cols.length;i++){
      const c=cols[i],x=i*gap;
      if(c.pg){ctx.fillStyle=c.col;ctx.fillText(c.pg.g,x,c.pg.y)}      // l'ancienne tête prend la couleur de la colonne
      c.y+=c.sp;const y=c.y*size;
      if(y>-size){const g=GLYPHS.charAt((Math.random()*GLYPHS.length)|0);ctx.fillStyle='#1e130e';ctx.fillText(g,x,y);c.pg={g,y}}   // la tête est brun foncé
      if(y>h&&Math.random()>0.94)reset(c,false);
    }
  }
  function stop(){running=false;cancelAnimationFrame(raf);ctx.clearRect(0,0,w,h)}
  function start(){
    stop();
    if(reduceMotion||!state.fx.rain){cv.style.display='none';return}
    cv.style.display='block';layout();running=true;raf=requestAnimationFrame(frame);
  }
  let rt=0;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(running)layout()},200)});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;cancelAnimationFrame(raf)}else if(state.fx.rain&&!reduceMotion&&!running){running=true;raf=requestAnimationFrame(frame)}});
  return{start,stop};
})();
// les titres du haut de page se « décodent » en changeant d'onglet (pas à chaque case cochée)
function decodeTitles(){
  if(reduceMotion||!state.fx.rain)return;
  [...view.querySelectorAll('.hero h2')].slice(0,2).forEach(el=>{
    if(el.children.length)return;
    const txt=el.textContent,n=txt.length,t0=performance.now(),dur=Math.min(700,260+n*16);
    (function step(now){
      if(!el.isConnected)return;
      const p=Math.min(1,(now-t0)/dur);let s='';
      for(let i=0;i<n;i++){const ch=txt.charAt(i);s+=(ch===' '||i<p*n*1.12)?ch:GLYPHS.charAt((Math.random()*GLYPHS.length)|0)}
      el.textContent=p<1?s:txt;
      if(p<1)requestAnimationFrame(step);
    })(t0);
  });
}

ensureStart();
render();
rain.start();
decodeTitles();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
