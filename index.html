<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2457">
<title>Ma Routine — Nutrition</title>
<meta name="description" content="Menus et listes de courses du lundi au vendredi, calculés selon tes séances ROAD TO GI, ton poids et ton budget.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Routine">

<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
/* Thème GIGN, identique à ROAD TO GI : bleu roi, or, rouge, blanc */
:root{--bg:#0a2457;--surface:#133a85;--surface2:#1b4a9e;--line:#3a69c4;--text:#fff;--muted:#b7c8f0;--gold:#f5c518;--red:#d9232d;--blue:#2f64c8;--good:#58d39b;--warn:#f2bb5f;--danger:#ff5a63;--navh:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#071d4b}
body{margin:0;color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:linear-gradient(180deg,#0d2d6b 0,#0a2457 40%,#071d4b 100%) no-repeat #071d4b;min-height:100vh;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
.app{max-width:820px;margin:0 auto;padding:0 14px calc(var(--navh) + 40px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;margin:0 -14px 8px;padding:calc(10px + env(safe-area-inset-top)) 14px 14px;background:rgba(8,29,74,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(var(--red) 0 50%,var(--gold) 50% 100%)}
.brandmark{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;letter-spacing:.5px;color:#fff;background:radial-gradient(circle at 50% 36%,#4a82e6 0,#2f64c8 38%,#14357a 100%);border:3px solid var(--gold);box-shadow:0 0 0 2px var(--red),0 0 0 3.5px #fff,0 3px 10px rgba(0,0,0,.5);margin-right:3px;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:19px;line-height:1.15}
.top small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:19px;line-height:1}
.iconbtn.on{border-color:var(--gold);background:var(--surface2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.card.hero{border-color:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.card.off{opacity:.62}
.card h2{font-size:18px}
.card h3{font-size:16px}
.rb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.gap{margin-top:10px}
.eyebrow{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.chip{display:inline-block;border:1px solid rgba(245,197,24,.55);background:#0b2860;color:var(--gold);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;margin:2px 4px 2px 0;white-space:nowrap}
.chip.red{border-color:#ff6b73;color:#ffb3b8}
.chip.good{border-color:var(--good);color:var(--good)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.plain{border-color:var(--line);color:#dbe6ff}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#13203f;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.red{background:#8e1a22;border-color:#ff6b73}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select,textarea{width:100%;background:#0a2457;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:16px;color:#fff}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
::placeholder{color:#8fa6d8;opacity:1}
input[type=date]{min-height:44px}
label.f{display:block;font-size:12px;color:var(--muted)}
label.f input,label.f select{margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chk{-webkit-appearance:none;appearance:none;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--gold);background:#0a2457;position:relative;margin:0}
.chk:checked{background:var(--gold)}
.chk:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#13203f;font-weight:900;font-size:16px}
.bar{height:10px;background:#0a2457;border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffd84d);border-radius:99px}
.bar.over>i{background:linear-gradient(90deg,var(--red),var(--danger))}
.bar.blue>i{background:linear-gradient(90deg,#4a82e6,#8fb4ff)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:8px;justify-items:center}
.ringbox{position:relative;width:104px;height:104px}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ringtxt b{font-size:19px}
.ringtxt small{font-size:11px;color:var(--muted)}
.ringcap{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
.meal{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid rgba(58,105,196,.55)}
.meal:first-of-type{border-top:0}
.meal .t{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.meal .n{background:none;border:0;padding:0;text-align:left;font-weight:750;font-size:15px;line-height:1.3;color:#fff}
.meal .m{color:var(--muted);font-size:12px;margin-top:2px}
.meal .c{text-align:right;font-weight:800;white-space:nowrap}
.meal .sw{display:block;margin-top:6px;margin-left:auto;background:none;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:12px;padding:3px 8px}
.meal.done .n{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin:4px 4px 0 0;font-size:12px;color:#dbe6ff}
.seg{display:flex;gap:6px;margin:12px 0}
.seg button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:800;font-size:13px;line-height:1.2}
.seg button.on{background:var(--gold);color:#13203f;border-color:var(--gold)}
.seg button small{display:block;font-weight:600;font-size:10.5px;opacity:.85;margin-top:2px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.days button{padding:9px 2px;border-radius:12px;border:1px solid var(--line);background:#0a2457;color:var(--muted);font-weight:800;font-size:13px;line-height:1.15}
.days button.on{background:var(--surface2);color:#fff;border-color:var(--gold)}
.days button small{display:block;font-weight:600;font-size:10px;margin-top:2px}
.cyc{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cyc b{display:block;text-align:center;flex:1}
.cyc button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.cyc button:disabled{opacity:.35}
.shoprow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(58,105,196,.55)}
.shoprow:first-of-type{border-top:0}
.shoprow .q{font-weight:800;text-align:right}
.shoprow.stock{opacity:.7}
.shoprow.ck b{text-decoration:line-through;color:var(--muted)}
.note{border-left:3px solid var(--gold);padding:9px 11px;background:#0b2860;border-radius:9px;color:#dbe6ff;font-size:12.5px;margin:12px 0}
.warnbox{border-left:3px solid var(--danger);padding:9px 11px;background:#3a1020;border-radius:9px;color:#ffd5d8;font-size:13px;margin:12px 0}
.okbox{border-left:3px solid var(--good);padding:9px 11px;background:#0c3a3a;border-radius:9px;color:#d5fff0;font-size:13px;margin:12px 0}
details>summary{cursor:pointer;color:#dbe6ff;padding:4px 0;list-style:none;font-weight:700}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--gold)}
details[open]>summary::before{content:"▾ "}
.rcp{padding:0}
.rcp>summary{padding:12px 14px;display:block}
.rcp .body{padding:0 14px 14px}
.rcp ol{padding-left:20px;margin:10px 0 8px}
.rcp li{margin:5px 0;color:#e6eeff}
.tip{margin-top:10px;padding:9px 10px;background:#0b2860;border:1px solid var(--line);border-radius:10px;font-size:13.5px}
.search{margin:6px 0 10px}
.exrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid rgba(58,105,196,.55);font-size:14px}
.exrow:first-of-type{border-top:0}
.exrow .d{color:var(--muted);font-size:12px}
.exrow button{background:none;border:0;color:var(--danger);font-size:16px;padding:4px 8px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{background:#0b2860;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(8,29,74,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:3px solid var(--gold);box-shadow:0 -2px 0 var(--red);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:0;padding:8px 2px 9px;color:var(--muted);font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:var(--navh)}
.tabs button .i{font-size:21px;line-height:1.1}
.tabs button.on{color:var(--gold)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,12,35,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:20px 20px 0 0;width:min(820px,100%);max-height:88vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet .x{float:right;margin:-4px -4px 6px 8px}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.opt.cur{border-color:var(--gold)}
.opt b{font-size:14px}
.opt small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom));z-index:60;background:#fff;color:#13203f;font-weight:700;border-radius:999px;padding:9px 16px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.spark{width:100%;height:84px;display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin-top:8px}
.kv span:nth-child(even){text-align:right;font-weight:800}
.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--danger)}
textarea{min-height:76px;resize:vertical}
.big{font-size:26px;font-weight:900;line-height:1.1}
.act{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid rgba(58,105,196,.55);font-size:14px}
.act:first-of-type{border-top:0}
.act .d{color:var(--muted);font-size:12px}
.act.today{background:rgba(245,197,24,.12);border-radius:10px;padding-left:6px;padding-right:6px}
@media (max-width:380px){.ringbox{width:92px;height:92px}.ringbox svg{width:92px;height:92px}.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>

function dateNumber(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');if(!m)return NaN;const t=Date.UTC(+m[1],+m[2]-1,+m[3]);return new Date(t).toISOString().slice(0,10)===v?t:NaN}
function addDays(v,n){return new Date(dateNumber(v)+n*864e5).toISOString().slice(0,10)}
function dow(v){return new Date(dateNumber(v)).getUTCDay()}
function mondayOf(v){return addDays(v,-((dow(v)+6)%7))}
function parisDateKey(now=new Date()){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:PARIS_ZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
  const g=t=>p.find(x=>x.type===t).value;return `${g('year')}-${g('month')}-${g('day')}`;
}

function todayKey(){try{const q=new URLSearchParams(location.search).get('d');if(q&&Number.isFinite(dateNumber(q)))return q}catch(e){}return parisDateKey()}
const fmtLong=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
const fmtShort=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',timeZone:'UTC'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dLong=v=>cap(fmtLong.format(new Date(dateNumber(v))));
const dShort=v=>fmtShort.format(new Date(dateNumber(v)));
const nf0=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});

const kc=n=>nf0.format(Math.round(n));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v){const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:NaN}
const fmtN=(n,d=1)=>{const k=Math.pow(10,d);return (Math.round(n*k)/k).toString().replace('.',',')};
const sgn=(n,d=1)=>(n>0?'+':n<0?'−':'')+fmtN(Math.abs(n),d);

  get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
  del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
};

/* ---------- Valeurs nutritionnelles : calories et protéines par unité du catalogue (tables usuelles, à ±10 %) ---------- */
const NUTR={skyr:[0.62,0.11],eggs:[75,6.5],chicken:[1.10,0.23],turkey:[1.25,0.21],tuna:[120,27],oats:[3.7,0.13],rice:[3.55,0.07],pasta:[3.55,0.125],potatoes:[0.77,0.02],semolina:[3.6,0.12],bread:[80,3.2],lentils:[3.5,0.25],beans:[1.05,0.075],veg:[0.30,0.02],banana:[95,1.2],apple:[75,0.4],onion:[0.40,0.011],tomato:[0.35,0.014],milk:[0.46,0.033]};
const STARCH=new Set(Object.keys(FOODS).filter(k=>FOODS[k].cat==='Féculents'));
// Calories et protéines de chaque recette, recalculées à partir des quantités (+ 40 kcal de matière grasse de cuisson midi et soir).
// Les féculents sont la variable d'ajustement : on les augmente ou les réduit pour atteindre les calories du jour, les protéines restent.
Object.values(MEAL_BY_ID).forEach(m=>{
  let k=m.id[0]==='b'?0:40,p=0,sk=0,sp=0;
  Object.entries(m.shop).forEach(([f,q])=>{k+=q*NUTR[f][0];p+=q*NUTR[f][1];if(STARCH.has(f)){sk+=q*NUTR[f][0];sp+=q*NUTR[f][1]}});
  m.kcal=Math.round(k/5)*5;m.protein=Math.round(p);m.sk=sk;m.sp=sp;
});

/* ---------- État ---------- */
const DEFAULT={
  goals:{budget:230,kcal:2100,protein:180,water:2500,auto:true},
  profile:{sex:'',age:0,height:0,weight:0,target:0,rate:0.5,pal:1.3,protKg:2,adjust:0,kgForce:6,kgCourse:7},
  start:null,prices:{},checks:{},extras:{},water:{},swaps:{},off:{},offMeal:{},shop:{},spend:[],weights:[],rerolls:{}
};
function load(){
  let saved={};try{saved=JSON.parse(store.get(KEY)||'{}')||{}}catch(e){saved={}}
  const base=structuredClone(DEFAULT);
  const s={...base,...saved,goals:{...base.goals,...(saved.goals||{})},profile:{...base.profile,...(saved.profile||{})}};
  ['prices','checks','extras','water','swaps','off','offMeal','shop','rerolls'].forEach(k=>{if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))s[k]={}});
  ['spend','weights'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  return s;
}
let state=load();
function save(){store.set(KEY,JSON.stringify(state))}
// Tout ce qui change les menus ou les quantités (jours, prix, budget, profil…) passe par bump() pour refaire les calculs.
let ver=0;const cycleCache=new Map(),mealCache=new Map(),planCache=new Map();
function bump(){ver++;mealCache.clear();cycleCache.clear()}
function resetCaches(){planCache.clear();bump()}

/* Lien facultatif avec ROAD TO GI : même navigateur = même stockage ; sinon on colle sa sauvegarde. */
function readRtg(){try{const raw=localStorage.getItem('roadToGI_v1');if(!raw)return null;const s=JSON.parse(raw);return s&&typeof s==='object'?s:null}catch(e){return null}}
function applyRtg(s){
  const got=[];
  if(!s||typeof s!=='object')return got;
  if(Number.isFinite(dateNumber(s.startDate))){state.start=mondayOf(s.startDate);got.push('début de la préparation')}
  const bw=Number((s.profile||{}).bodyWeight);
  if(bw>30&&bw<250){
    if(!state.weights.some(w=>w.d===todayKey())){setWeight(todayKey(),bw);got.push('poids '+fmtN(bw)+' kg')}
    if(!(state.profile.weight>0))state.profile.weight=bw;
  }
  resetCaches();
  return got;
}
function ensureStart(){
  if(Number.isFinite(dateNumber(state.start)))return;
  const r=readRtg();
  if(r&&Number.isFinite(dateNumber(r.startDate))){state.start=mondayOf(r.startDate)}
  else{const t=todayKey(),d=dow(t);state.start=(d===6||d===0)?addDays(mondayOf(t),7):mondayOf(t)}
  save();
}

/* ---------- Poids ---------- */
function setWeight(d,kg){
  state.weights=state.weights.filter(w=>w.d!==d);state.weights.push({d,kg});
  state.weights.sort((a,b)=>a.d<b.d?-1:1);
}
const lastWeight=()=>state.weights.length?state.weights[state.weights.length-1]:null;
// pente de la courbe de poids sur les 28 derniers jours (kg par semaine), si au moins 3 pesées sur 7 jours ou plus
function weightTrend(today){
  const from=addDays(today,-28),ws=state.weights.filter(w=>w.d>=from&&w.d<=today);
  if(ws.length<3)return null;
  const x0=dateNumber(ws[0].d)/864e5,xs=ws.map(w=>dateNumber(w.d)/864e5-x0);
  if(xs[xs.length-1]<7)return null;
  const n=ws.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ws.reduce((a,w)=>a+w.kg,0)/n;
  let sxy=0,sxx=0;ws.forEach((w,i)=>{sxy+=(xs[i]-mx)*(w.kg-my);sxx+=(xs[i]-mx)**2});
  return sxx>0?{perWeek:sxy/sxx*7,n,days:xs[xs.length-1]}:null;
}

/* ---------- Dépense énergétique : tes séances ROAD TO GI + poids actuel / poids cible ---------- */
// Planning ROAD TO GI : functional lundi, mercredi, vendredi ; course + abdos mardi, jeudi (et samedi) ; dimanche repos.
const ACT={0:{k:'rest',n:'Repos'},1:{k:'force',n:'Functional training · pecs et dos'},2:{k:'course',n:'Course + abdos'},3:{k:'force',n:'Functional training · jambes et épaules'},4:{k:'course',n:'Course + abdos'},5:{k:'force',n:'Functional training · pecs et dos'},6:{k:'course',n:'Course + circuit'}};
const DAY_NAMES=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const actOf=date=>ACT[dow(date)];
function profileReady(){
  const p=state.profile;
  return p.weight>30&&p.weight<250&&p.height>120&&p.height<230&&p.age>12&&p.age<100&&(p.sex==='H'||p.sex==='F')&&p.target>30&&p.target<250;
}
function energy(adjust){
  if(!profileReady())return{ready:false};
  const p=state.profile,w=p.weight;if(adjust===undefined)adjust=p.adjust;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='H'?5:-161),base=bmr*p.pal;
  const tdee={force:base+p.kgForce*w,course:base+p.kgCourse*w,rest:base};
  const diff=w-p.target,mode=diff>0.5?'cut':diff<-0.5?'bulk':'maint';
  const rate=mode==='maint'?0:p.rate,floor=Math.max(bmr,p.sex==='H'?1500:1200);
  const targets={};let capped=false;
  ['force','course'].forEach(k=>{
    // l'écart hebdomadaire voulu est réparti sur les 5 jours planifiés (le week-end n'est pas compté)
    const want=tdee[k]+(mode==='cut'?-1:mode==='bulk'?1:0)*rate*7700/5+adjust;
    let t=want;
    // jamais plus de 25 % sous la dépense, ni sous le plancher de sécurité (on n'alerte que si cela change vraiment le déficit)
    if(mode==='cut'){const lim=Math.max(tdee[k]*0.75,floor);if(t<lim){t=lim;if(tdee[k]-t<(tdee[k]-want)*0.9)capped=true}}
    targets[k]=Math.round(t/10)*10;
  });
  return{ready:true,bmr,base,tdee,mode,rate,floor,targets,capped,diff,protein:Math.round(p.protKg*w/5)*5};
}
const auto=()=>state.goals.auto&&profileReady();
function targetKcal(date){const d=dow(date);if(auto()){const e=energy();return e.targets[ACT[d]&&ACT[d].k==='course'?'course':'force']}return state.goals.kcal}
function targetProtein(){return auto()?energy().protein:state.goals.protein}
const rateOptions=mode=>mode==='bulk'?[[0.1,'Doux · +0,1 kg/sem'],[0.2,'Modéré · +0,2 kg/sem'],[0.3,'Rapide · +0,3 kg/sem']]:[[0.25,'Doux · −0,25 kg/sem'],[0.5,'Modéré · −0,5 kg/sem'],[0.75,'Rapide · −0,75 kg/sem']];

/* ---------- Cycles de 4 semaines (lundi-vendredi) alignés sur les 4 semaines d'un programme ROAD TO GI ---------- */
function monthSeed(id){let s=0;for(const c of id)s=(s*31+c.charCodeAt(0))>>>0;return s}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,rand){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// 20 repas par créneau : chaque recette revient au plus ~2 fois et jamais deux fois dans les 4 derniers jours.
function sequence(pool,rand,count){
  const out=[];let bag=[];
  while(out.length<count){
    if(!bag.length)bag=shuffled(pool,rand);
    const recent=out.slice(-4).map(m=>m.id);
    let i=bag.findIndex(m=>!recent.includes(m.id));if(i<0)i=0;
    out.push(bag.splice(i,1)[0]);
  }
  return out;
}
function buildCycle(seed){
  const rand=mulberry32(monthSeed(seed));
  const seqs=SLOTS.map(s=>sequence(s.pool,rand,20));
  return [0,1,2,3].map(w=>[0,1,2,3,4].map(d=>seqs.map(q=>q[w*5+d].id)));
}
const flatIds=weeks=>weeks.flat(2);
function diffRatio(a,b){if(!a||!b||a.length!==b.length)return 1;let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n/a.length}
function differentSalt(cs,prevIds,startSalt){
  let best=startSalt,bestDiff=-1;
  for(let salt=startSalt;salt<startSalt+80;salt++){
    const diff=diffRatio(flatIds(buildCycle(cs+'#'+salt)),prevIds);
    if(diff>bestDiff){bestDiff=diff;best=salt}
    if(diff>=0.70)return{salt,diff};
  }
  return{salt:best,diff:bestDiff};
}
// menus de base d'un cycle (avant jours décochés et ajustement au budget)
function planFor(cs){
  if(planCache.has(cs))return planCache.get(cs);
  const prevIds=cs!==state.start?flatIds(planFor(addDays(cs,-28)).weeks):null;
  let salt=0;
  if(state.rerolls[cs]!=null)salt=state.rerolls[cs];
  else if(prevIds)salt=differentSalt(cs,prevIds,0).salt;
  const weeks=buildCycle(cs+'#'+salt),res={salt,diff:prevIds?diffRatio(flatIds(weeks),prevIds):null,weeks};
  planCache.set(cs,res);return res;
}
function cycleStart(k){return addDays(state.start,28*k)}
function posOf(date){
  const e=Math.round((dateNumber(date)-dateNumber(state.start))/864e5),wk=Math.floor(e/7);
  return{e,wk,upcoming:e<0,k:wk<0?0:Math.floor(wk/4),week:wk<0?0:((wk%4)+4)%4};
}
const dayDate=(cs,w,d)=>addDays(cs,w*7+d);

/* ---------- Jours planifiés, portions, budget ---------- */
// Un jour se décoche en entier (state.off) ; un repas se décoche seul (state.offMeal). Dans les deux cas il quitte les courses et le budget.
const dayOn=(cs,w,d)=>!state.off[`${cs}|${w}|${d}`];
const mealOn=(cs,w,d,s)=>dayOn(cs,w,d)&&!state.offMeal[`${cs}|${w}|${d}|${s}`];
const dayMask=(cs,w,d)=>[0,1,2].map(s=>mealOn(cs,w,d,s));
const dayActive=(cs,w,d)=>dayMask(cs,w,d).some(Boolean);
function daysOn(cs,w){let n=0;for(let d=0;d<5;d++)if(dayActive(cs,w,d))n++;return n}
function cycleDays(cs){let n=0;for(let w=0;w<4;w++)n+=daysOn(cs,w);return n}
function weekMeals(cs,w){let n=0;for(let d=0;d<5;d++)n+=dayMask(cs,w,d).filter(Boolean).length;return n}
function cycleMeals(cs){let n=0;for(let w=0;w<4;w++)n+=weekMeals(cs,w);return n}
const SHARE=[0.30,0.36,0.34];   // part des calories du jour : matin, midi, soir
const budgetPerDay=()=>state.goals.budget/20;
const budgetPerMeal=()=>state.goals.budget/60;
// budget dégressif : 230 € pour 60 repas = 3,83 € par repas (11,50 € par jour de 3 repas) ; chaque jour ou repas décoché retire sa part
const cycleBudget=cs=>Math.round(budgetPerMeal()*cycleMeals(cs)*100)/100;
const price=k=>{const v=state.prices[k];return Number.isFinite(v)&&v>0?v:FOODS[k].packPrice};

function scaleIngredient(txt,k,f){
  // « 100 g riz cru » -> « 85 g riz cru » ; « 3 tranches pain complet » -> « 2,5 tranches pain complet »
  const m=/^(\d+(?:[.,]\d+)?)\s*(g|ml|tranches?)?\s+(.*)$/.exec(txt);
  if(!m)return txt;
  const kw={oats:'avoine',rice:'riz',pasta:'pâtes',potatoes:'pommes de terre',semolina:'semoule',bread:'pain'}[k];
  if(!kw||!m[3].toLowerCase().includes(kw))return txt;
  let q=parseFloat(m[1].replace(',','.'))*f;
  if(m[2]==='g'||m[2]==='ml')return `${Math.max(5,Math.round(q/5)*5)} ${m[2]} ${m[3]}`;
  q=Math.max(0.5,Math.round(q*2)/2);
  return `${fmtN(q,1)} ${q>1?'tranches':'tranche'} ${m[3]}`;
}
// f = facteur appliqué aux féculents de la recette (1 = recette d'origine)
function scaleMeal(m,f){
  const ck=m.id+'|'+f;
  if(mealCache.has(ck))return mealCache.get(ck);
  const shop={};let cost=0.2;
  Object.entries(m.shop).forEach(([k,q])=>{const qq=STARCH.has(k)?q*f:q;shop[k]=qq;cost+=qq/FOODS[k].packSize*price(k)});
  let ingredients=m.ingredients;
  if(f!==1)ingredients=m.ingredients.map(t=>{for(const k of Object.keys(m.shop))if(STARCH.has(k)){const r=scaleIngredient(t,k,f);if(r!==t)return r}return t});
  const res={...m,f,kcal:Math.round((m.kcal+(f-1)*m.sk)/5)*5,protein:Math.round(m.protein+(f-1)*m.sp),cost:Math.round(cost*100)/100,shop,ingredients};
  mealCache.set(ck,res);return res;
}
// facteur de féculents du jour pour atteindre les calories visées sur les repas gardés (0,5 à 1,8, par pas de 0,05)
function scaledDay(date,ids,mask){
  const base=ids.map(i=>MEAL_BY_ID[i]),on=mask||[true,true,true];
  const share=on.reduce((a,v,s)=>a+(v?SHARE[s]:0),0);
  let S=0,B=0;base.forEach((m,s)=>{if(on[s]){S+=m.sk;B+=m.kcal}});
  let f=1;
  if(S>0)f=Math.round(Math.min(1.8,Math.max(0.5,1+(targetKcal(date)*share-B)/S))*20)/20;
  return{f,share,meals:base.map(m=>scaleMeal(m,f))};
}

// menus effectifs d'un cycle : menus de base, ajustés au budget quand les jours choisis le demandent
function planCost(cs,ids){
  const inv={};let total=0;
  for(let w=0;w<4;w++){
    const needs={};
    for(let d=0;d<5;d++){
      const mask=dayMask(cs,w,d);
      if(!mask.some(Boolean))continue;
      scaledDay(dayDate(cs,w,d),ids[w][d],mask).meals.forEach((m,s)=>{if(mask[s])Object.entries(m.shop).forEach(([k,q])=>{needs[k]=(needs[k]||0)+q})});
    }
    Object.entries(needs).forEach(([k,need])=>{
      const f=FOODS[k],avail=inv[k]||0,deficit=Math.max(0,need-avail);
      let bought=0;
      if(deficit>0){const u=Math.ceil(deficit/f.packSize-1e-9);bought=u*f.packSize;total+=u*price(k)}
      inv[k]=Math.max(0,avail+bought-need);
    });
  }
  return total;
}
function optimizeIds(cs,base){
  const budget=cycleBudget(cs),ids=base.map(w=>w.map(d=>d.slice()));
  const info={changed:0,before:planCost(cs,ids),after:0};
  let cost=info.before;
  if(cost<=budget){info.after=cost;return{ids,info}}
  for(let it=0;it<30&&cost>budget*0.98;it++){
    let best=null;
    for(let w=0;w<4;w++)for(let d=0;d<5;d++){
      for(let s=0;s<3;s++){
        if(!mealOn(cs,w,d,s)||state.swaps[`${cs}|${w}|${d}|${s}`])continue;
        const cur=ids[w][d][s];
        for(const m of SLOTS[s].pool){
          if(m.id===cur)continue;
          let dup=false;for(let d2=0;d2<5;d2++)if(d2!==d&&mealOn(cs,w,d2,s)&&ids[w][d2][s]===m.id)dup=true;
          if(dup)continue;
          ids[w][d][s]=m.id;const c=planCost(cs,ids);ids[w][d][s]=cur;
          if(!best||c<best.c)best={w,d,s,id:m.id,c};
        }
      }
    }
    if(!best||best.c>=cost-0.01)break;
    ids[best.w][best.d][best.s]=best.id;cost=best.c;info.changed++;
  }
  info.after=cost;return{ids,info};
}
function cycleIds(cs){
  const c=cycleCache.get(cs);if(c&&c.ver===ver)return c;
  const o=optimizeIds(cs,planFor(cs).weeks),res={ver,ids:o.ids,info:o.info};
  cycleCache.set(cs,res);return res;
}
function idAt(cs,w,d,s){
  const sw=state.swaps[`${cs}|${w}|${d}|${s}`];
  return MEAL_BY_ID[sw]?sw:cycleIds(cs).ids[w][d][s];
}
const mealSwapped=(cs,w,d,s)=>{const sw=state.swaps[`${cs}|${w}|${d}|${s}`];return !!(MEAL_BY_ID[sw]&&sw!==planFor(cs).weeks[w][d][s])};
// meals : les 3 repas du jour ; on[s] : le repas est gardé ; tot et target ne comptent que les repas gardés
function dayPlan(cs,w,d){
  const date=dayDate(cs,w,d),mask=dayMask(cs,w,d),sd=scaledDay(date,[0,1,2].map(s=>idAt(cs,w,d,s)),mask);
  const tot=sd.meals.reduce((a,m,s)=>mask[s]?{kcal:a.kcal+m.kcal,prot:a.prot+m.protein,cost:a.cost+m.cost}:a,{kcal:0,prot:0,cost:0});
  return{date,f:sd.f,meals:sd.meals,tot,on:mask,any:mask.some(Boolean),target:Math.round(targetKcal(date)*sd.share),fullTarget:targetKcal(date),dayOff:!dayOn(cs,w,d)};
}

function weekNeeds(cs,w){
  const t={};
  for(let d=0;d<5;d++){
    const P=dayPlan(cs,w,d);
    P.meals.forEach((m,s)=>{if(P.on[s])Object.entries(m.shop).forEach(([k,v])=>{t[k]=(t[k]||0)+v})});
  }
  return t;
}
function purchasePlan(cs){
  const inv={},weeks=[];let total=0;
  for(let w=0;w<4;w++){
    const needs=weekNeeds(cs,w),buys={};let cost=0;
    Object.entries(needs).forEach(([k,need])=>{
      const f=FOODS[k],avail=inv[k]||0,deficit=Math.max(0,need-avail);
      let units=0,bought=0,c=0;
      if(deficit>0){units=Math.ceil(deficit/f.packSize-1e-9);bought=units*f.packSize;c=units*price(k)}
      const left=Math.max(0,avail+bought-need);inv[k]=left;
      buys[k]={need,avail,units,left,cost:c};cost+=c;
    });
    total+=cost;weeks.push({needs,buys,cost});
  }
  return{weeks,total};
}
function fmtQty(k,v){
  const f=FOODS[k];
  if(f.unit==='g')return v>=1000?(v/1000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' kg':Math.round(v)+' g';
  if(f.unit==='ml')return v>=1000?(v/1000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' L':Math.round(v)+' ml';
  const n=Math.ceil(v-1e-9);
  if(f.unit==='u')return n+' unité'+(n>1?'s':'');
  if(f.unit==='tranche')return n+' tranche'+(n>1?'s':'');
  if(f.unit==='boîte')return n+' boîte'+(n>1?'s':'');
  return String(v);
}
const buyText=(k,p)=>FOODS[k].loose?`${p.units} ${p.units>1?FOODS[k].pack.toLowerCase():FOODS[k].pack.toLowerCase().replace(/s$/,'')}`:`${p.units} × ${FOODS[k].packLabel}`;
function cycleSpend(cs){const end=addDays(cs,27);return state.spend.filter(x=>x.d>=cs&&x.d<=end).reduce((a,x)=>a+x.a,0)}
// reste sur le budget initial à la fin du cycle : budget - le plus grand des achats prévus (liste ajustée) et de ce qui est déjà dépensé
function budgetLeft(cs){
  const planned=purchasePlan(cs).total,spent=cycleSpend(cs),init=state.goals.budget;
  return{init,planned,spent,left:init-Math.max(planned,spent)};
}
// retire / remet un jour ou un repas, puis annonce l'effet sur les courses et sur le reste du budget
function changePlan(cs,fn){
  const b=budgetLeft(cs);fn();bump();save();
  const a=budgetLeft(cs),d=a.planned-b.planned;
  keepScroll(render);
  toast(`${Math.abs(d)<0.005?'Liste de courses mise à jour':'Courses '+(d<0?'−':'+')+euro(Math.abs(d))} · il te reste ${euro(a.left)} sur ton budget`);
}

];
function eatenOf(date,plan){
  const e={kcal:0,prot:0,cost:0};
  plan.meals.forEach((m,s)=>{if(plan.on[s]&&state.checks[`${date}|${s}`]){e.kcal+=m.kcal;e.prot+=m.protein;e.cost+=m.cost}});
  (state.extras[date]||[]).forEach(x=>{e.kcal+=x.k;e.prot+=x.p;e.cost+=x.c});

/* ---------- Interface ---------- */
const view=document.getElementById('view');
const ui={tab:'today',k:null,week:null,rcat:'all',rweek:false,q:''};
let lastDay=todayKey();
const keepScroll=fn=>{const y=window.scrollY;fn();window.scrollTo(0,y)};

function viewDate(){const t=todayKey(),d=dow(t);return(d===0||d===6)?addDays(mondayOf(t),7):t}
function uiCycle(){
  const p=posOf(viewDate());
  const k=ui.k==null?p.k:ui.k;
  const w=ui.week==null?(ui.k==null||ui.k===p.k?p.week:0):ui.week;
  return{k,w,cs:cycleStart(k),cur:p};
}
const chip=(t,c='')=>`<span class="chip ${c}">${t}</span>`;
function bar(pct,cls=''){return `<div class="bar ${cls}${pct>1.0001?' over':''}"><i style="width:${Math.min(100,Math.max(0,pct*100)).toFixed(1)}%"></i></div>`}
function ring(pct,color,big,small){
  const r=38,c=2*Math.PI*r,p=Math.min(1,Math.max(0,pct));
  return `<div class="ringbox"><svg viewBox="0 0 92 92" width="104" height="104" aria-hidden="true"><circle cx="46" cy="46" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="9"/>${p>0.004?`<circle cx="46" cy="46" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 46 46)"/>`:''}</svg><div class="ringtxt"><b>${big}</b><small>${small}</small></div></div>`;
}
function gapText(delta,unit,tol){
  const a=Math.abs(Math.round(delta));
  if(a<=tol)return `<span class="ok">dans la cible</span>`;
  return `<span class="warn">${delta>0?'+':'−'}${nf0.format(a)} ${unit}</span>`;
}
const TIPS=[
  'Quand tu cuisines, prépare deux portions : le repas du lendemain est déjà prêt.',
  'Skyr, œufs et thon sont les protéines les plus économiques : garde-en toujours en stock.',
  'Pèse-toi toujours dans les mêmes conditions (matin, à jeun) pour que la courbe veuille dire quelque chose.',
  'Regarde la liste de courses avant de partir : les restes de la semaine précédente sont déjà déduits.',
  'Les féculents sont la variable d’ajustement : si tu as faim, garde les protéines et les légumes, joue sur le riz ou les pâtes.',
  'Un repas raté ne ruine pas la semaine : coche ce que tu manges vraiment, l’appli ajuste les totaux.'
];
const tipOfDay=date=>TIPS[Math.floor(dateNumber(date)/864e5)%TIPS.length];
const fText=f=>Math.abs(f-1)<0.03?'':`Féculents ×${fmtN(f,2)}`;

/* Bandeaux : profil à compléter, poids qui a changé */
function profileBanner(onGoal){
  if(!profileReady())return onGoal?'': `<div class="note"><b>Calories sur mesure :</b> renseigne ton profil (âge, taille, poids, poids cible) pour que l’appli calcule tes calories selon tes séances. En attendant, objectifs fixes : ${kc(state.goals.kcal)} kcal et ${kc(state.goals.protein)} g de protéines.<div class="btns"><button class="btn sm gold" data-act="goto" data-tab="goal">Compléter mon profil</button></div></div>`;
  const lw=lastWeight();
  if(lw&&Math.abs(lw.kg-state.profile.weight)>=1.5)return `<div class="note">Ton poids est passé de ${fmtN(state.profile.weight)} à ${fmtN(lw.kg)} kg. Recalculer tes calories ?<div class="btns"><button class="btn sm gold" data-act="weight-sync">Recalculer avec ${fmtN(lw.kg)} kg</button></div></div>`;
  return '';
}

/* --- Aujourd'hui --- */
function renderToday(){
  const today=todayKey(),d=dow(today);
  ensureStart();
  const p=posOf(today);
  if(d===0||d===6)return renderWeekend(today);
  if(p.upcoming){
    return `<section class="card hero"><div class="eyebrow">${dLong(today)}</div><h2>Ton cycle commence le ${dLong(state.start).toLowerCase()}</h2>
    <p class="muted gap">D’ici là, tu peux déjà régler ton objectif, regarder les menus du premier cycle et préparer la liste de courses.</p>
    <div class="btns"><button class="btn gold" data-act="goto" data-tab="goal">Mon objectif</button><button class="btn" data-act="goto" data-tab="menus">Menus</button><button class="btn" data-act="goto" data-tab="shop">Courses</button></div></section>`;
  }
  const cs=cycleStart(p.k),di=d-1,act=ACT[d],plan=dayPlan(cs,p.week,di),goalK=plan.fullTarget,goalP=targetProtein();
  let h=profileBanner();
  h+=`<section class="card hero"><div class="eyebrow">${dLong(today)}</div><h2>${esc(act.n)}</h2>
    <div style="margin-top:6px">${chip('Cycle '+(p.k+1)+' · semaine '+(p.week+1)+'/4')}${chip(act.k==='force'?'Jour de force':'Jour de course','plain')}</div>
    <div class="small muted gap">Objectif du jour : <b>${kc(goalK)} kcal</b> · <b>${kc(goalP)} g</b> de protéines${auto()?' (calculé pour ton profil)':''}</div></section>`;
  if(!plan.any){
    return h+`<section class="card"><h3>Jour non planifié</h3><p class="muted gap">Tu as retiré ce jour (ou tous ses repas) : pas de repas prévu, rien dans la liste de courses, et ton budget en tient compte.</p><div class="btns"><button class="btn gold" data-act="dayon" data-k="${cs}|${p.week}|${di}">Replanifier ce jour</button><button class="btn" data-act="goto" data-tab="shop">Courses</button></div></section>`+goalCards(today);
  }
  const bl=budgetLeft(cs),E=eatenOf(today,plan),spent=cycleSpend(cs),bud=cycleBudget(cs),nPlanned=plan.on.filter(Boolean).length,eatenMeals=[0,1,2].filter(s=>plan.on[s]&&state.checks[`${today}|${s}`]).length;
  const water=state.water[today]||0,wGoal=state.goals.water,remK=Math.max(0,goalK-E.kcal),remP=Math.max(0,goalP-E.prot);
  h+=`<section class="card"><div class="rb"><h3>Mes objectifs du jour</h3><span class="small muted">${eatenMeals}/${nPlanned} repas cochés</span></div>
    <div class="rings gap">
      <div>${ring(E.kcal/goalK,E.kcal>goalK*1.08?'#ff5a63':'#f5c518',kc(E.kcal),'/ '+kc(goalK)+' kcal')}<div class="ringcap">Calories</div></div>
      <div>${ring(E.prot/goalP,E.prot>=goalP?'#58d39b':'#f5c518',kc(E.prot)+' g','/ '+kc(goalP)+' g')}<div class="ringcap">Protéines</div></div>
    </div>
    <div class="small muted gap" style="text-align:center">${E.kcal===0?'Coche tes repas au fil de la journée.':(remK>0||remP>0?`Il te reste <b>${kc(remK)} kcal</b> et <b>${kc(remP)} g</b> de protéines pour atteindre tes objectifs.`:'Objectifs du jour atteints.')}${nPlanned<3?' Pour un repas retiré, note ce que tu manges ailleurs avec « Ajout libre ».':''}</div>
    <div class="gap"><div class="rb small"><span>💧 Eau</span><span><b>${fmtN(water/1000)} L</b> / ${fmtN(wGoal/1000)} L</span></div>${bar(water/wGoal,'blue')}
    <div class="btns"><button class="btn sm" data-act="water" data-v="-250">− 250 ml</button><button class="btn sm gold" data-act="water" data-v="250">+ 250 ml</button><button class="btn sm" data-act="water" data-v="500">+ 500 ml</button></div></div>
    <div class="gap"><div class="rb small"><span>🛒 Budget du cycle (${cycleMeals(cs)} repas)</span><span><b>${euro(spent)}</b> / ${euro(bud)}</span></div>${bar(bud>0?spent/bud:0)}
    <div class="small muted" style="margin-top:6px">${bl.left>=0?`Reste prévu à la fin du cycle : <b class="ok">${euro(bl.left)}</b> sur ton budget initial de ${euro(bl.init)}.`:`Dépassement prévu : <b class="bad">${euro(-bl.left)}</b> au-delà de ton budget initial de ${euro(bl.init)}.`}</div></div></section>`;
  h+=`<section class="card"><div class="rb"><h3>Repas du jour</h3><span class="small muted">${kc(plan.tot.kcal)} kcal · ${kc(plan.tot.prot)} g</span></div>${fText(plan.f)?`<div class="small muted">${fText(plan.f)} pour atteindre ${kc(plan.target)} kcal</div>`:''}`;
  plan.meals.forEach((m,s)=>{h+=mealRow(m,s,today,cs,p.week,di,'eat')});
  h+=`<div class="quick">${QUICK.map((q,i)=>`<button type="button" data-act="quick" data-i="${i}">+ ${esc(q.n)}</button>`).join('')}</div>
    <div class="small muted" style="margin-top:6px">Touche un ajout pour l’ajouter aux totaux du jour (quantités approximatives).</div>`;
  const ex=state.extras[today]||[];
  if(ex.length)h+=`<div class="gap">${ex.map((x,i)=>`<div class="exrow" style="grid-template-columns:1fr auto auto"><span>${esc(x.n)}</span><span class="d">${kc(x.k)} kcal · ${kc(x.p)} g</span><button type="button" data-act="extra-del" data-i="${i}" aria-label="Retirer">✕</button></div>`).join('')}</div>`;
  h+=`<details class="gap"><summary>Ajout libre</summary><div class="grid3 gap"><label class="f">Nom<input id="xn" type="text" placeholder="Barre, fruit…"></label><label class="f">kcal<input id="xk" inputmode="numeric" placeholder="200"></label><label class="f">Prot. (g)<input id="xp" inputmode="numeric" placeholder="20"></label></div><button class="btn sm gold gap" data-act="extra-add">Ajouter</button></details></section>`;
  h+=goalCards(today);
  h+=`<section class="card"><div class="eyebrow">Conseil</div><p class="gap">${esc(act.k==='force'?'Jour de force : déjeune 2 à 3 h avant la séance et garde un repas riche en protéines après, pour la récupération.':'Jour de course : privilégie les féculents (riz, pâtes, pommes de terre) au repas précédent et bois régulièrement.')} ${esc(tipOfDay(today))}</p></section>`;
  return h;
}
function goalCards(today){
  const lw=lastWeight();
  return `<section class="card"><div class="rb"><h3>⚖️ Poids de corps</h3>${lw?`<span class="small muted">dernier : <b>${fmtN(lw.kg)} kg</b> (${dShort(lw.d)})</span>`:''}</div>
    <div class="grid2 gap" style="align-items:end"><label class="f">Poids du jour (kg)<input id="wkg" inputmode="decimal" placeholder="${lw?fmtN(lw.kg):'ex. 90'}"></label><button class="btn gold" data-act="weight-add">Enregistrer</button></div>
    ${profileReady()?`<div class="small muted gap">Objectif : ${fmtN(state.profile.target)} kg · il te reste ${fmtN(Math.abs((lw?lw.kg:state.profile.weight)-state.profile.target))} kg ${energy().mode==='bulk'?'à prendre':'à perdre'}.</div>`:''}</section>`;
}
function renderWeekend(today){
  const next=viewDate(),p=posOf(next),cs=cycleStart(p.k);
  let h=profileBanner()+`<section class="card hero"><div class="eyebrow">${dLong(today)}</div><h2>Week-end : repos</h2>
    <p class="muted gap">L’appli ne planifie que du lundi au vendredi. Profites-en pour récupérer et préparer la semaine.</p></section>`;
  if(p.upcoming){
    return h+`<section class="card"><p>Ton cycle commence le <b>${dLong(state.start).toLowerCase()}</b>.</p><div class="btns"><button class="btn gold" data-act="goto" data-tab="shop">Liste de courses</button><button class="btn" data-act="goto" data-tab="goal">Mon objectif</button></div></section>`;
  }
  const n=daysOn(cs,p.week),m=weekMeals(cs,p.week);
  h+=`<section class="card"><div class="rb"><h3>Semaine du ${dShort(next)}</h3>${chip(m+' / 15 repas',m===15?'good':'warn')}</div>
    <p class="muted small gap">Touche les jours où tu veux des repas à la maison (et décoche des repas seuls dans les menus) : les courses et le budget s’adaptent (${euro(budgetPerMeal())} par repas). ${n} jour${n>1?'s':''} planifié${n>1?'s':''}.</p>
    ${dayButtons(cs,p.week)}
    <div class="btns"><button class="btn gold" data-act="goto" data-tab="shop">Ouvrir la liste de courses</button><button class="btn" data-act="goto" data-tab="menus">Voir les menus</button></div></section>`;
  h+=goalCards(today)+`<section class="card"><div class="eyebrow">Conseil</div><p class="gap">${esc(tipOfDay(today))}</p></section>`;
  return h;
}
// mode 'plan' (onglet Menus) : la case = « au menu », la décocher retire le repas des courses et du budget
// mode 'eat' (onglet Aujourd'hui) : la case = « mangé » ; « Retirer » retire le repas des courses et du budget
function mealRow(m,s,date,cs,w,di,mode){
  const mk=`${cs}|${w}|${di}|${s}`,planned=mealOn(cs,w,di,s),sw=mealSwapped(cs,w,di,s);
  const head=`<div class="t">${SLOTS[s].ico} ${SLOTS[s].name}${sw?' · remplacé':''}</div><button class="n" data-act="recipe" data-id="${m.id}" data-f="${m.f}">${esc(m.name)}</button>`;
  const change=`<button class="sw" data-act="swap" data-cs="${cs}" data-w="${w}" data-d="${di}" data-s="${s}">↻ changer</button>`;
  if(!planned){
    return `<div class="meal done">${mode==='plan'?`<input class="chk" type="checkbox" data-chg="mealon" data-k="${mk}" aria-label="Remettre au menu">`:'<span></span>'}<div>${head}<div class="m">Retiré : plus dans les courses ni dans le budget</div></div><div class="c"><button class="sw" data-act="mealtoggle" data-k="${mk}">Remettre</button></div></div>`;
  }
  const info=`<div class="m">${m.kcal} kcal · <b>${m.protein} g</b> de protéines</div>`;
  if(mode==='plan')return `<div class="meal"><input class="chk" type="checkbox" data-chg="mealon" data-k="${mk}" checked aria-label="Au menu : décocher pour retirer des courses"><div>${head}${info}</div><div class="c">${euro(m.cost)}${change}</div></div>`;
  const k=`${date}|${s}`,on=!!state.checks[k];
  return `<div class="meal ${on?'done':''}"><input class="chk" type="checkbox" data-chg="meal" data-k="${k}" ${on?'checked':''} aria-label="Repas mangé"><div>${head}${info}</div><div class="c">${euro(m.cost)}${change}<button class="sw" data-act="mealtoggle" data-k="${mk}">Retirer</button></div></div>`;
}

/* --- Menus --- */
function cycleNav(c){
  const maxK=posOf(viewDate()).k+1;
  return `<div class="card"><div class="cyc"><button data-act="cyc" data-v="-1" ${c.k<=0?'disabled':''} aria-label="Cycle précédent">‹</button><b>Cycle ${c.k+1}<span class="small muted" style="display:block;font-weight:600">${dShort(c.cs)} → ${dShort(addDays(c.cs,25))}${c.k===c.cur.k&&!c.cur.upcoming?' · en cours':''}</span></b><button data-act="cyc" data-v="1" ${c.k>=maxK?'disabled':''} aria-label="Cycle suivant">›</button></div></div>`;
}
function weekSeg(c){
  return `<div class="seg">${[0,1,2,3].map(i=>`<button type="button" data-act="week" data-w="${i}" class="${c.w===i?'on':''}">Semaine ${i+1}<small>${dShort(dayDate(c.cs,i,0))} – ${dShort(dayDate(c.cs,i,4))}</small></button>`).join('')}</div>`;
}
function dayButtons(cs,w){
  return `<div class="days">${[0,1,2,3,4].map(d=>{const k=dayMask(cs,w,d).filter(Boolean).length;return `<button type="button" data-act="dayon" data-k="${cs}|${w}|${d}" class="${k?'on':''}">${['Lun','Mar','Mer','Jeu','Ven'][d]}<small>${k===3?'✓':k?k+'/3':'—'}</small></button>`}).join('')}</div>`;
}
function dayToggles(c){
  const n=daysOn(c.cs,c.w),m=weekMeals(c.cs,c.w);
  return `<div class="card"><div class="rb"><h3>Jours et repas planifiés</h3>${chip(m+' / 15 repas',m===15?'good':'warn')}</div>
    ${dayButtons(c.cs,c.w)}
    <div class="small muted gap">Touche un jour pour le retirer ou le remettre, ou décoche un repas seul dans les menus (restaurant, repas ailleurs…) : il disparaît des courses et son budget (${euro(budgetPerMeal())} par repas) est retiré. ${n} jour${n>1?'s':''}, ${m} repas : budget de la semaine <b>${euro(budgetPerMeal()*m)}</b>.</div></div>`;
}
function renderMenus(){
  ensureStart();
  const c=uiCycle(),cs=c.cs,today=todayKey();
  let h=cycleNav(c)+weekSeg(c)+dayToggles(c)+`<div class="note">La case de chaque repas veut dire « au menu » : décoche-la pour retirer ce repas des courses et du budget. Pour noter ce que tu as mangé, va dans Aujourd’hui.</div>`;
  const info=cycleIds(cs).info;
  if(info.changed>0)h+=`<div class="okbox">Menus ajustés au budget : ${info.changed} repas remplacés par des recettes moins chères pour tenir ${euro(cycleBudget(cs))}.</div>`;
  let wk={kcal:0,prot:0,cost:0},nOn=0;
  for(let d=0;d<5;d++){
    const P=dayPlan(cs,c.w,d),act=actOf(P.date);
    h+=`<section class="card ${P.date===today?'hero':''} ${P.any?'':'off'}"><div class="rb"><h2>${dLong(P.date)}</h2>${P.date===today?chip("Aujourd’hui",'good'):''}</div>
      <div class="small muted" style="margin:3px 0 4px">${act.k==='force'?'💪':'🏃'} ${esc(act.n)}</div>`;
    if(!P.any){h+=`<p class="muted small">Jour non planifié : pas de repas ni de courses.</p><div class="btns"><button class="btn sm" data-act="dayon" data-k="${cs}|${c.w}|${d}">Replanifier</button></div></section>`;continue}
    nOn++;wk.kcal+=P.tot.kcal;wk.prot+=P.tot.prot;wk.cost+=P.tot.cost;
    P.meals.forEach((m,s)=>{h+=mealRow(m,s,P.date,cs,c.w,d,'plan')});
    const dk=P.tot.kcal-P.target,dp=P.tot.prot-targetProtein()*SHARE.reduce((a,v,s)=>a+(P.on[s]?v:0),0);
    h+=`<div class="small muted" style="margin-top:8px"><b>${kc(P.tot.kcal)} kcal</b> (cible ${kc(P.target)} : ${gapText(dk,'kcal',60)}) · <b>${kc(P.tot.prot)} g</b> de protéines (${gapText(dp,'g',8)}) · ${euro(P.tot.cost)}${fText(P.f)?` · ${fText(P.f)}`:''}</div></section>`;
  }
  h+=`<section class="card"><h3>Résumé de la semaine ${c.w+1}</h3>${nOn?`<div class="kv"><span>Jours planifiés</span><span>${nOn} / 5</span><span>Moyenne par jour</span><span>${kc(wk.kcal/nOn)} kcal · ${kc(wk.prot/nOn)} g</span><span>Coût des repas</span><span>${euro(wk.cost)}</span></div>`:'<p class="muted small gap">Aucun jour planifié cette semaine.</p>'}</section>`;
  return h;
}

/* --- Courses et budget --- */
function renderShop(){
  ensureStart();
  const c=uiCycle(),cs=c.cs,pp=purchasePlan(cs),wk=pp.weeks[c.w],bud=cycleBudget(cs),nDays=cycleDays(cs),nMeals=cycleMeals(cs),spent=cycleSpend(cs);
  let h=cycleNav(c);
  const init=state.goals.budget,left=init-Math.max(pp.total,spent);
  h+=`<section class="card hero"><div class="rb"><h2>Budget du cycle</h2>${chip(nMeals===0?'aucun repas':pp.total<=bud+0.005?'dans le budget':'au-dessus',nMeals===0?'plain':pp.total<=bud+0.005?'good':'red')}</div>
    <div class="eyebrow gap">Reste à la fin du cycle</div><div class="big ${left>=0?'ok':'bad'}">${euro(left)}</div>
    <div class="small muted">${left>=0?`sur ton budget initial de ${euro(init)}`:`de dépassement sur ton budget initial de ${euro(init)}`}. La liste de courses se recalcule dès que tu retires un jour ou un repas : ce que tu économises s’ajoute à ce reste.</div>
    <div class="kv"><span>Budget initial</span><span>${euro(init)}</span><span>Courses prévues (liste ajustée)</span><span>${euro(pp.total)}</span><span>Dépensé réellement</span><span>${euro(spent)}</span><span>Repas planifiés</span><span>${nMeals} / 60 (${nDays} jours)</span><span>Budget ajusté à ces repas</span><span>${euro(bud)}</span><span>Reste sur le budget ajusté</span><span class="${bud-Math.max(pp.total,spent)<0?'bad':'ok'}">${euro(bud-Math.max(pp.total,spent))}</span></div>
    <div class="small muted gap">Dépensé réel</div>${bar(init>0?spent/init:0)}
    <div class="small muted" style="margin-top:6px">Courses prévues</div>${bar(init>0?pp.total/init:0,'blue')}
    <div class="small muted gap">Le budget ajusté est dégressif : ${euro(init)} pour 60 repas, soit ${euro(budgetPerMeal())} par repas (${euro(budgetPerDay())} par jour de 3 repas) ; chaque jour ou repas décoché retire sa part.</div>
    <details class="gap"><summary>Noter une dépense</summary><div class="grid2 gap"><label class="f">Montant (€)<input id="sa" inputmode="decimal" placeholder="45,20"></label><label class="f">Magasin / note<input id="sl" type="text" placeholder="Courses semaine 1"></label></div><button class="btn sm gold gap" data-act="spend-add">Ajouter</button></details>
    ${state.spend.filter(x=>x.d>=cs&&x.d<=addDays(cs,27)).sort((a,b)=>a.d<b.d?1:-1).map(x=>`<div class="exrow" style="grid-template-columns:62px 1fr auto auto"><span class="d">${dShort(x.d)}</span><span>${esc(x.l||'Courses')}</span><b>${euro(x.a)}</b><button type="button" data-act="spend-del" data-id="${x.id}" aria-label="Supprimer">✕</button></div>`).join('')}</section>`;
  const info=cycleIds(cs).info;
  if(info.changed>0)h+=`<div class="okbox">Menus ajustés au budget : ${info.changed} repas remplacés par des recettes moins chères (de ${euro(info.before)} à ${euro(info.after)}).</div>`;
  else if(nMeals>0&&pp.total>bud+0.005)h+=`<div class="warnbox">Même avec les recettes les moins chères, les courses dépassent le budget de ${euro(pp.total-bud)}. Retire des jours ou des repas, ou augmente le budget dans les réglages.</div>`;
  h+=weekSeg(c)+dayToggles(c);
  const nOn=daysOn(cs,c.w),mOn=weekMeals(cs,c.w);
  const cum=pp.weeks.slice(0,c.w+1).reduce((a,x)=>a+x.cost,0);
  h+=`<section class="card"><div class="rb"><h2>Semaine ${c.w+1}</h2><b>${euro(wk.cost)}</b></div><div class="small muted">Après cette semaine, il te reste <b class="${init-cum>=0?'ok':'bad'}">${euro(init-cum)}</b> sur ton budget initial.</div><div class="small muted" style="margin-top:6px">${mOn?`${mOn} repas sur ${nOn} jour${nOn>1?'s':''}, du ${dShort(dayDate(cs,c.w,0))} au ${dShort(dayDate(cs,c.w,4))} — les restes des semaines précédentes sont déjà déduits. Ce que tu gardes en stock sert aux semaines suivantes.`:'Aucun repas planifié : rien à acheter cette semaine.'}</div></section>`;
  const keys=Object.keys(wk.needs),buy=keys.filter(k=>wk.buys[k].units>0),stock=keys.filter(k=>wk.buys[k].units===0);
  const rowFor=k=>{

/* --- Objectif : profil, calories, efficacité --- */
function sparkline(){
  const ws=state.weights.slice(-30);
  if(ws.length<2)return '';
  const min=Math.min(...ws.map(w=>w.kg)),max=Math.max(...ws.map(w=>w.kg)),span=Math.max(0.5,max-min);
  const px=i=>(8+i*(304/(ws.length-1))).toFixed(1),py=w=>(70-((w.kg-min)/span)*56).toFixed(1);
  return `<svg class="spark" viewBox="0 0 320 84" preserveAspectRatio="none" role="img" aria-label="Courbe de poids"><polyline points="${ws.map((w,i)=>px(i)+','+py(w)).join(' ')}" fill="none" stroke="#f5c518" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${ws.map((w,i)=>`<circle cx="${px(i)}" cy="${py(w)}" r="3" fill="#fff"/>`).join('')}</svg><div class="rb small muted"><span>${fmtN(min)} kg</span><span>${fmtN(max)} kg</span></div>`;
}
// variation de poids prévue par semaine (kg) avec les jours planifiés du cycle
function plannedWeekly(cs,E){
  let kcal=0;
  for(let w=0;w<4;w++)for(let d=0;d<5;d++){
    // l'écart s'applique à la part de la journée qui reste au menu
    const share=dayMask(cs,w,d).reduce((a,v,s)=>a+(v?SHARE[s]:0),0);
    if(!share)continue;
    const date=dayDate(cs,w,d),k=ACT[dow(date)].k;
    kcal+=(E.targets[k]-E.tdee[k])*share;
  }
  return kcal/4/7700;
}

    else{vshort='Déficit agressif';verdict='Déficit agressif : risque de perte de muscle et de fatigue. Choisis un rythme plus doux.';vcls='red'}
  }else if(E.mode==='bulk'){
    if(wk<0.05){vshort='Surplus trop faible';verdict='Surplus trop faible pour prendre du poids. Planifie plus de jours ou choisis un rythme plus rapide.';vcls='warn'}

    <p class="gap small">${esc(verdict)}</p>${E.capped?`<div class="warnbox">Le déficit demandé a été limité par sécurité (jamais sous ${kc(E.floor)} kcal ni plus de 25 % sous ta dépense).</div>`:''}

  // ajustement d'après la courbe réelle
  const tr=weightTrend(today);
  if(tr&&E.mode!=='maint'){
    const planned=wk,diff=tr.perWeek-planned,nAvg=Math.max(1,nDays/4);

    <div class="btns"><a class="btn" href="../road-to-gi/">Ouvrir ROAD TO GI</a></div></section>`;

  return h;

function openModal(html){modal.innerHTML=`<div class="sheet"><button class="btn sm x" data-act="close" type="button" aria-label="Fermer">✕</button>${html}</div>`;modal.hidden=false;document.body.style.overflow='hidden'}

modal.addEventListener('click',e=>{

    if(t.dataset.id==='')delete state.swaps[k];else state.swaps[k]=t.dataset.id;

function openSwap(cs,w,d,s){
  const P=dayPlan(cs,w,d),cur=P.meals[s],orig=MEAL_BY_ID[planFor(cs).weeks[w][d][s]];

  }).join('');

  view.innerHTML=fn();
  document.getElementById('sub').textContent=TITLES[ui.tab]||'';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  document.getElementById('gear').classList.toggle('on',ui.tab==='settings');
}
function goto(tab){ui.tab=tab;render();window.scrollTo(0,0)}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)goto(b.dataset.tab)});
document.getElementById('gear').addEventListener('click',()=>goto(ui.tab==='settings'?'today':'settings'));

view.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,D=t.dataset;
  switch(a){
    case 'goto':goto(D.tab);break;
    case 'recipe':openRecipe(D.id,Number(D.f)||1);break;
    case 'swap':openSwap(D.cs,+D.w,+D.d,+D.s);break;
    case 'cyc':{const c=uiCycle();ui.k=Math.max(0,c.k+Number(D.v));ui.week=0;render();break}
    case 'week':ui.week=+D.w;keepScroll(render);break;
    case 'dayon':{
      // jour gardé -> retiré ; jour retiré (ou sans aucun repas) -> remis en entier avec ses 3 repas
      const [dcs,dw,dd]=D.k.split('|');
      changePlan(dcs,()=>{
        if(dayActive(dcs,+dw,+dd))state.off[D.k]=true;
        else{delete state.off[D.k];[0,1,2].forEach(s=>delete state.offMeal[`${D.k}|${s}`])}
      });break;
    }
    case 'mealtoggle':changePlan(D.k.split('|')[0],()=>{if(state.offMeal[D.k])delete state.offMeal[D.k];else state.offMeal[D.k]=true});break;
    case 'water':{const d=todayKey();state.water[d]=Math.max(0,Math.min(10000,(state.water[d]||0)+Number(D.v)));save();keepScroll(render);break}
    case 'quick':{const q=QUICK[+D.i],d=todayKey();(state.extras[d]??=[]).push({n:q.n,k:q.k,p:q.p,c:q.c});save();keepScroll(render);toast('Ajouté : '+q.n);break}
    case 'extra-add':{
      const n=(document.getElementById('xn').value||'').trim()||'Ajout',k=num(document.getElementById('xk').value),p=num(document.getElementById('xp').value);
      if(!(k>=0)){toast('Indique les calories');break}
      const d=todayKey();(state.extras[d]??=[]).push({n,k:Math.round(k),p:Number.isFinite(p)?Math.round(p):0,c:0});save();keepScroll(render);break;
    }
    case 'extra-del':{const d=todayKey();(state.extras[d]||[]).splice(+D.i,1);save();keepScroll(render);break}
    case 'weight-add':{
      const v=num(document.getElementById('wkg').value);
      if(!(v>30&&v<250)){toast('Entre un poids en kg (ex. 89,5)');break}
      setWeight(todayKey(),v);if(!(state.profile.weight>0)){state.profile.weight=v;bump()}
      save();keepScroll(render);toast('Poids enregistré');break;
    }
    case 'weight-del':state.weights=state.weights.filter(w=>w.d!==D.d);save();keepScroll(render);break;
    case 'weight-sync':{const lw=lastWeight();if(lw){state.profile.weight=lw.kg;bump();save();keepScroll(render);toast('Calories recalculées')}break}
    case 'adjust':state.profile.adjust=Number(D.v)||0;bump();save();keepScroll(render);toast('Ajustement enregistré');break;
    case 'spend-add':{
      const v=num(document.getElementById('sa').value),l=(document.getElementById('sl').value||'').trim();
      if(!(v>0)){toast('Indique un montant');break}
      state.spend.push({id:Date.now().toString(36),d:todayKey(),l,a:Math.round(v*100)/100});save();keepScroll(render);toast('Dépense ajoutée');break;
    }
    case 'spend-del':state.spend=state.spend.filter(x=>x.id!==D.id);save();keepScroll(render);break;
    case 'prices-reset':if(confirm('Remettre tous les prix d’origine ?')){state.prices={};bump();save();keepScroll(render)}break;
    case 'rcat':ui.rcat=D.v;keepScroll(render);break;
    case 'rtg-import':{const got=applyRtg(readRtg());save();document.getElementById('rtgStatus').textContent=got.length?'Repris : '+got.join(', ')+'.':'Rien à reprendre.';break}
    case 'rtg-paste':{
      const st=document.getElementById('rtgStatus');let data;
      try{data=JSON.parse(document.getElementById('rtgText').value)}catch(err){st.textContent='Texte illisible : colle la sauvegarde complète.';break}
      const s=data&&data.app==='road-to-gi'&&data.state;
      if(!s||typeof s!=='object'){st.textContent='Ce texte n’est pas une sauvegarde ROAD TO GI.';break}
      const got=applyRtg(s);save();st.textContent=got.length?'Repris : '+got.join(', ')+'.':'Rien à reprendre dans cette sauvegarde.';break;
    }
    case 'reroll':{
      if(!confirm('Remplacer les menus du cycle affiché par de nouveaux menus ?'))break;
      const c=uiCycle(),cur=planFor(c.cs),ch=differentSalt(c.cs,flatIds(cur.weeks),cur.salt+1);
      state.rerolls[c.cs]=ch.salt;
      Object.keys(state.swaps).filter(k=>k.startsWith(c.cs+'|')).forEach(k=>delete state.swaps[k]);
      resetCaches();save();render();toast('Nouveaux menus pour ce cycle');break;
    }
    case 'backup-copy':{
      const box=document.getElementById('backupText'),st=document.getElementById('backupStatus'),text=JSON.stringify({app:'ma-routine',version:2,state});
      box.value=text;
      (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>{st.textContent='Sauvegarde copiée. Colle-la dans une note ou un message à toi-même.'},()=>{box.focus();box.select();st.textContent='Copie le texte sélectionné ci-dessus.'});
      break;
    }
    case 'backup-restore':{
      const st=document.getElementById('backupStatus');let data;
      try{data=JSON.parse(document.getElementById('backupText').value)}catch(err){st.textContent='Texte illisible : colle la sauvegarde complète.';break}
      const s=data&&data.app==='ma-routine'&&data.state;
      if(!s||typeof s!=='object'){st.textContent='Ce texte n’est pas une sauvegarde Ma Routine.';break}
      if(!confirm('Remplacer les données de ce téléphone par cette sauvegarde ?'))break;
      store.set(KEY,JSON.stringify(s));state=load();resetCaches();ensureStart();save();render();toast('Sauvegarde restaurée');break;
    }
    case 'reset':if(confirm('Tout effacer sur ce téléphone (objectifs, profil, repas cochés, poids) ?')){store.del(KEY);state=load();resetCaches();ensureStart();ui.k=null;ui.week=null;render();toast('Données effacées')}break;
  }
});
view.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;
  const a=t.dataset.chg,k=t.dataset.k;
  switch(a){
    case 'meal':if(t.checked)state.checks[k]=true;else delete state.checks[k];save();keepScroll(render);break;
    case 'mealon':changePlan(k.split('|')[0],()=>{if(t.checked)delete state.offMeal[k];else state.offMeal[k]=true});break;
    case 'shop':if(t.checked)state.shop[k]=true;else delete state.shop[k];save();keepScroll(render);break;
    case 'goal':{
      const v=num(t.value),min={budget:50,kcal:1200,protein:60,water:500}[k];
      if(v>=min)state.goals[k]=k==='budget'?Math.round(v*100)/100:Math.round(v);
      bump();save();keepScroll(render);break;
    }
    case 'goalauto':state.goals.auto=t.checked;bump();save();keepScroll(render);break;
    case 'prof':{
      const p=state.profile;
      if(k==='sex')p.sex=t.value;
      else if(k==='pal'||k==='rate'){const v=num(t.value);if(v>0)p[k]=v}
      else{
        const v=num(t.value),lim={age:[13,99],height:[120,230],weight:[30,250],target:[30,250],kgForce:[1,15],kgCourse:[1,15]}[k];
        if(v>=lim[0]&&v<=lim[1])p[k]=(k==='age'||k==='height')?Math.round(v):Math.round(v*10)/10;
        if(k==='weight'&&v>=30&&v<=250)setWeight(todayKey(),Math.round(v*10)/10);
      }
      // si le sens de l'objectif change, on prend le rythme du milieu
      const E=energy();if(E.ready&&E.mode!=='maint'&&!rateOptions(E.mode).some(([v])=>Math.abs(v-p.rate)<0.001))p.rate=rateOptions(E.mode)[1][0];
      bump();save();keepScroll(render);break;
    }
    case 'start':{
      if(Number.isFinite(dateNumber(t.value))){state.start=mondayOf(t.value);resetCaches();ui.k=null;ui.week=null;save();render();toast('Départ : lundi '+dShort(state.start))}
      break;
    }
    case 'price':{const v=num(t.value);if(v>0)state.prices[k]=Math.round(v*100)/100;else delete state.prices[k];bump();save();keepScroll(render);break}
    case 'rweek':ui.rweek=t.checked;keepScroll(render);break;
  }
});
view.addEventListener('input',e=>{
  if(e.target.id==='rq'){ui.q=e.target.value;document.getElementById('rlist').innerHTML=recipeListHtml()}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const t=todayKey();if(t!==lastDay){lastDay=t;ui.k=null;ui.week=null;render()}
});

ensureStart();
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
